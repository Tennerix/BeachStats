<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beach Tennis – Historique</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,900;1,700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080f1e; --surface:#0d1829; --card:#111e35; --border:#1e3560;
  --gold:#f5c518; --blue:#3b82f6; --orange:#f97316; --green:#22c55e;
  --red:#ef4444; --text:#e2eaf8; --muted:#4a6494;
}
body{font-family:Barlow,sans-serif;min-height:100vh;background:var(--bg);color:var(--text);
  display:flex;flex-direction:column;align-items:center;padding:0 1rem 4rem}
.header{width:100%;max-width:580px;display:flex;align-items:center;justify-content:space-between;
  padding:1.2rem 0 1rem;border-bottom:1px solid var(--border);margin-bottom:1.2rem}
.header-logo{font-family:Barlow Condensed,sans-serif;font-size:22px;font-weight:900;letter-spacing:3px;
  text-transform:uppercase;color:var(--gold)}
.header-logo span{color:var(--text);opacity:.5}
.header-back{background:none;border:1px solid var(--border);color:var(--muted);
  font-family:Barlow Condensed,sans-serif;font-size:12px;font-weight:700;letter-spacing:1.5px;
  text-transform:uppercase;padding:6px 14px;border-radius:8px;cursor:pointer;transition:all .18s}
.header-back:hover{border-color:var(--gold);color:var(--gold)}

.page-title{width:100%;max-width:580px;font-family:Barlow Condensed,sans-serif;font-size:20px;
  font-weight:900;letter-spacing:2px;text-transform:uppercase;margin-bottom:1rem;display:flex;
  align-items:center;justify-content:space-between}
.btn-clear{background:none;border:1px solid var(--red);color:var(--red);font-family:Barlow Condensed,sans-serif;
  font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:6px 12px;
  border-radius:8px;cursor:pointer}
.btn-clear:hover{background:rgba(239,68,68,.12)}

.empty{width:100%;max-width:580px;background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:2.5rem 1.5rem;text-align:center;color:var(--muted);font-size:14px}

.match-list{width:100%;max-width:580px;display:flex;flex-direction:column;gap:12px}
.match-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.1rem 1.3rem;
  position:relative}
.match-date{font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
.match-teams{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.team-name{font-family:Barlow Condensed,sans-serif;font-size:15px;font-weight:700}
.team-name.winner{color:var(--gold);font-weight:900}
.vs{color:var(--muted);font-size:12px;font-weight:700}
.match-score{font-family:Barlow Condensed,sans-serif;font-size:28px;font-weight:900;color:var(--gold);
  text-align:center;margin-bottom:4px}
.set-detail{text-align:center;color:var(--muted);font-size:12px;margin-bottom:10px}
.match-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);
  border-top:1px solid var(--border);padding-top:8px}
.btn-del{position:absolute;top:10px;right:10px;background:none;border:none;color:var(--muted);
  cursor:pointer;font-size:16px;line-height:1;padding:4px}
.btn-del:hover{color:var(--red)}
.btn-pdf{width:100%;margin-top:10px;padding:.6rem;border-radius:8px;border:1px solid var(--green);
  background:none;color:var(--green);font-family:Barlow Condensed,sans-serif;font-size:12px;font-weight:700;
  letter-spacing:1.5px;text-transform:uppercase;cursor:pointer}
.btn-pdf:hover{background:rgba(34,197,94,.12)}
</style>
</head>
<body>

<div class="header">
  <div class="header-logo">Beach<span>/</span>Stats</div>
  <button class="header-back" onclick="window.location.href='https://tennerix.github.io/BeachStats/'">← Accueil</button>
</div>

<div class="page-title">
  <span>Historique des matchs</span>
  <button class="btn-clear" onclick="clearHistory()">🗑 Tout effacer</button>
</div>

<div id="content"></div>

<script>
function loadHistory() {
  let hist = [];
  try { hist = JSON.parse(localStorage.getItem('beachstats_history')) || []; } catch(e) { hist = []; }
  return hist.sort((a,b) => b.id - a.id); // plus récent en premier
}

function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit', year:'numeric'}) +
    ' à ' + d.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
}

function render() {
  const hist = loadHistory();
  const content = document.getElementById('content');
  if (hist.length === 0) {
    content.innerHTML = '<div class="empty">Aucun match sauvegardé pour l\'instant.<br>Termine un match pour le voir apparaître ici.</div>';
    return;
  }
  content.innerHTML = '<div class="match-list">' + hist.map(m => {
    const aWon = m.winner === m.nameA;
    return `
      <div class="match-card">
        <button class="btn-del" onclick="deleteMatch(${m.id})" title="Supprimer">✕</button>
        <div class="match-date">${formatDate(m.date)}</div>
        <div class="match-teams">
          <span class="team-name ${aWon ? 'winner' : ''}">${escapeHtml(m.nameA)}</span>
          <span class="vs">VS</span>
          <span class="team-name ${!aWon ? 'winner' : ''}">${escapeHtml(m.nameB)}</span>
        </div>
        <div class="match-score">${escapeHtml(m.sets)}</div>
        ${m.setDetail ? `<div class="set-detail">${escapeHtml(m.setDetail)}</div>` : ''}
        <div class="match-meta">
          <span>⏱ ${escapeHtml(m.duration || '—')}</span>
          <span>Winners ${m.stats.wA}-${m.stats.wB} · Fautes ${m.stats.fA}-${m.stats.fB}</span>
        </div>
        <button class="btn-pdf" onclick="generatePDF(${m.id})">⬇ Télécharger le PDF</button>
      </div>`;
  }).join('') + '</div>';
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function deleteMatch(id) {
  let hist = loadHistory().filter(m => m.id !== id);
  localStorage.setItem('beachstats_history', JSON.stringify(hist));
  render();
}

function clearHistory() {
  if (!confirm('Supprimer tout l\'historique des matchs ? Cette action est irréversible.')) return;
  localStorage.removeItem('beachstats_history');
  render();
}

// ── GÉNÉRATION PDF À LA DEMANDE ──────────────────────────────────────────────
// On ne stocke jamais le PDF lui-même (trop lourd pour localStorage) : il est
// reconstruit à partir des données du match au moment où l'utilisateur clique.
function generatePDF(id) {
  const record = loadHistory().find(m => m.id === id);
  if (!record) return;

  const {jsPDF} = window.jspdf;
  const doc = new jsPDF({orientation:'portrait', unit:'mm', format:'a4'});
  const W = 210, M = 20;
  let y = M;

  const newPage = () => { doc.addPage(); doc.setFillColor(8,15,30); doc.rect(0,0,W,297,'F'); y = M; };
  const ensureSpace = (needed) => { if (y + needed > 282) newPage(); };
  const stripEmoji = (str) => String(str)
    .replace(/[\u{1F1E6}-\u{1FFFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{2190}-\u{21FF}\uFE0F\u200D]/gu, '')
    .replace(/\s+/g, ' ').trim();
  const sectionTitle = (title, color) => {
    ensureSpace(16);
    doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(...color);
    doc.text(title, M, y); y += 7;
    doc.setDrawColor(30,53,96); doc.line(M,y,W-M,y); y += 8;
  };

  doc.setFillColor(8,15,30); doc.rect(0,0,W,297,'F');

  doc.setFont('helvetica','bold'); doc.setFontSize(26); doc.setTextColor(245,197,24);
  doc.text('BEACH TENNIS — STATS DE BASE', W/2, y+8, {align:'center'}); y += 18;

  doc.setFontSize(10); doc.setTextColor(74,100,148);
  doc.text(new Date(record.date).toLocaleDateString('fr-FR',{weekday:'long',year:'numeric',month:'long',day:'numeric'}), W/2, y, {align:'center'});
  y += 10;
  doc.setDrawColor(30,53,96); doc.line(M,y,W-M,y); y += 10;

  ensureSpace(40);
  const winnerIsA = record.winner === record.nameA;
  const setHist = record.setHistory || [];
  const scoreStr = setHist.map(sh => {
    const wG = winnerIsA ? sh.a : sh.b, lG = winnerIsA ? sh.b : sh.a;
    return wG + '/' + lG;
  }).join('   -   ');

  doc.setFont('helvetica','bold'); doc.setFontSize(20); doc.setTextColor(245,197,24);
  doc.text(record.winner, W/2, y, {align:'center'}); y += 9;
  doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.setTextColor(226,234,248);
  doc.text(scoreStr || record.sets || '—', W/2, y, {align:'center'}); y += 8;
  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(74,100,148);
  doc.text('Durée du match : ' + (record.duration || '—'), W/2, y, {align:'center'}); y += 12;

  const [s1, s2] = (record.sets || '0-0').split('-').map(Number);
  [{label:'ÉQUIPE A', color:[59,130,246], name:record.nameA, sets:s1, idx:0},
   {label:'ÉQUIPE B', color:[249,115,22], name:record.nameB, sets:s2, idx:1}].forEach(t => {
    doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(...t.color);
    doc.text(t.label, M, y);
    doc.setFont('helvetica','normal'); doc.setFontSize(13); doc.setTextColor(226,234,248);
    doc.text(t.name, M, y+7);
    let setStr = setHist.map((sh,i) => {
      const sc = t.idx===0 ? sh.a : sh.b, opp = t.idx===0 ? sh.b : sh.a;
      return 'S'+(i+1)+': '+sc+(sc>opp?'*':'');
    }).join('  ');
    if (setStr) { doc.setFontSize(9); doc.setTextColor(74,100,148); doc.text(setStr, M, y+13); }
    doc.setFont('helvetica','bold'); doc.setFontSize(18); doc.setTextColor(245,197,24);
    doc.text('Sets : '+t.sets, W-M, y+6, {align:'right'});
    y += setStr ? 20 : 16;
    doc.setDrawColor(30,53,96); doc.line(M,y,W-M,y); y += 8;
  });
  y += 2;

  sectionTitle('POINTS GAGNANTS & FAUTES DIRECTES — PAR ÉQUIPE', [245,197,24]);
  const rows = [
    ['Points gagnants', record.stats.wA, record.stats.wB],
    ['Fautes directes', record.stats.fA, record.stats.fB],
    ['Points gagnés', record.stats.pA, record.stats.pB],
  ];
  doc.setFontSize(9); doc.setTextColor(74,100,148);
  doc.text('Statistique', M, y); doc.text('Éq.A', W/2, y, {align:'center'}); doc.text('Éq.B', W-M, y, {align:'right'});
  y += 4; doc.setDrawColor(30,53,96); doc.line(M,y,W-M,y); y += 5;
  rows.forEach(r => {
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(226,234,248); doc.text(r[0], M, y);
    doc.setFont('helvetica','bold');
    doc.setTextColor(59,130,246); doc.text(String(r[1]), W/2, y, {align:'center'});
    doc.setTextColor(249,115,22); doc.text(String(r[2]), W-M, y, {align:'right'});
    y += 7;
  });
  doc.setDrawColor(30,53,96); doc.line(M,y,W-M,y); y += 10;

  if (record.matchLog && record.matchLog.length) {
    sectionTitle('JOURNAL DU MATCH COMPLET', [245,197,24]);
    [...record.matchLog].reverse().forEach(entry => {
      ensureSpace(6);
      doc.setFont('helvetica','normal'); doc.setFontSize(9);
      doc.setTextColor(74,100,148); doc.text(entry.time, M, y);
      doc.setTextColor(180,200,230);
      const txt = (entry.team ? stripEmoji(entry.team)+' — ' : '') + stripEmoji(entry.msg);
      doc.text(txt, M+16, y);
      y += 6;
    });
  }

  doc.save('BeachStats_' + record.date.slice(0,10) + '.pdf');
}

render();
</script>
</body>
</html>
