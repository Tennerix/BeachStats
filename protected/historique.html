<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080f1e; --surface:#0d1829; --card:#111e35; --border:#1e3560;
  --gold:#f5c518; --blue:#3b82f6; --orange:#f97316; --green:#22c55e;
  --red:#ef4444; --text:#e2eaf8; --muted:#4a6494;
}
[data-theme="light"]{
  --bg:#eef1f6; --surface:#e7ecf3; --card:#f7f9fc; --border:#aebad2;
  --gold:#b3860f; --blue:#3b66c4; --orange:#c9601e; --green:#1f8a4c;
  --red:#c23a3a; --text:#2c3646; --muted:#748094;
}
[data-theme="neon"]{
  --bg:#050214; --surface:#0d0620; --card:#140a2e; --border:#3d1a6b;
  --gold:#ffe600; --blue:#00e5ff; --orange:#ff2e97; --green:#39ff14;
  --red:#ff2e5f; --text:#f2ecff; --muted:#8c6bc9;
}
[data-theme="sunset"]{
  --bg:linear-gradient(180deg,#200a12 0%,#4a1f16 22%,#b8531f 48%,#f0c542 62%,#6b2a52 84%,#241130 100%);
  --surface:linear-gradient(135deg,#3c1a14 0%,#6b3420 100%);
  --card:linear-gradient(150deg,#481f18 0%,#7a3f22 100%);
  --border:#a35a35;
  --gold:#ffcb3d; --blue:#5ec8f5; --orange:#ff7f3f; --green:#3fd9ae;
  --red:#ef4a4a; --text:#fff8ec; --muted:#e0b89f;
}
[data-theme="lagoon"]{
  --bg:linear-gradient(180deg,#02141a 0%,#053b3f 22%,#0a6e6e 48%,#17d6d0 62%,#0a4a5c 84%,#02121e 100%);
  --surface:linear-gradient(135deg,#04262b 0%,#0a4a4a 100%);
  --card:linear-gradient(150deg,#063339 0%,#0d5555 100%);
  --border:#1ec9c9;
  --gold:#ffd166; --blue:#22d3ee; --orange:#ff8c42; --green:#2dd4a7;
  --red:#ff5c5c; --text:#e0fbfc; --muted:#5fa8ac;
}
[data-theme="magma"]{
  --bg:linear-gradient(180deg,#0a0302 0%,#380a04 22%,#8a1c04 48%,#ff5b0f 62%,#5c0f0f 84%,#120303 100%);
  --surface:linear-gradient(135deg,#2e0a06 0%,#66190a 100%);
  --card:linear-gradient(150deg,#3d0e08 0%,#7d2308 100%);
  --border:#ff5c1a;
  --gold:#ffc300; --blue:#3fa9ff; --orange:#ff4b00; --green:#a4d84a;
  --red:#ff2020; --text:#fff2e0; --muted:#d98a5c;
}
[data-theme="glacier"]{
  --bg:linear-gradient(180deg,#020a12 0%,#062038 22%,#0f3f5c 48%,#63d8ff 62%,#123048 84%,#02101c 100%);
  --surface:linear-gradient(135deg,#04182a 0%,#0a3550 100%);
  --card:linear-gradient(150deg,#082238 0%,#0e3d5c 100%);
  --border:#3fa0cf;
  --gold:#d6faff; --blue:#7fd8ff; --orange:#ffb4a8; --green:#9dfcd8;
  --red:#ff8fa3; --text:#eaf9ff; --muted:#6f93ab;
}
/* ── SÉLECTEUR DE THÈME ── */
body{transition:background-color .25s ease,color .25s ease}
.theme-switch-wrap{position:relative}
.theme-menu{position:absolute;top:calc(100% + 8px);left:0;background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:8px;display:none;flex-direction:column;gap:2px;z-index:30;min-width:170px;
  box-shadow:0 8px 24px rgba(0,0,0,.5)}
.theme-menu.open{display:flex}
.theme-swatch{display:flex;align-items:center;gap:8px;background:none;border:none;color:var(--text);
  font-family:Barlow,sans-serif;font-size:13px;padding:7px 8px;border-radius:6px;cursor:pointer;text-align:left;width:100%}
.theme-swatch:hover{background:var(--surface)}
.theme-swatch.active{outline:1px solid var(--gold)}
.theme-swatch.locked{opacity:.55}
.theme-swatch .lock-badge{margin-left:auto;font-size:9px;font-weight:900;letter-spacing:.5px;color:var(--gold);display:none;align-items:center;gap:2px;flex-shrink:0}
.theme-swatch.locked .lock-badge{display:flex}
.prefs-menu-label{font-family:Barlow Condensed,sans-serif;font-size:10px;font-weight:700;letter-spacing:1px;
  text-transform:uppercase;color:var(--muted);padding:4px 8px 2px}
.sw{width:14px;height:14px;border-radius:50%;flex-shrink:0;border:1px solid rgba(255,255,255,.25)}
.sw-dark{background:linear-gradient(135deg,#080f1e,#3b82f6)}
.sw-light{background:linear-gradient(135deg,#f7f9fc,#3b66c4)}
.sw-neon{background:linear-gradient(135deg,#050214,#ff2e97)}
.sw-sunset{background:linear-gradient(135deg,#2a130f,#ff6b1a)}
.sw-lagoon{background:linear-gradient(135deg,#02141a,#17d6d0)}
.sw-magma{background:linear-gradient(135deg,#0a0302,#ff5b0f)}
.sw-glacier{background:linear-gradient(135deg,#020a12,#63d8ff)}
body{font-family:Barlow,sans-serif;min-height:100vh;background:var(--bg);color:var(--text);
  display:flex;flex-direction:column;align-items:center;padding:0 1rem 4rem}
.header{width:100%;max-width:580px;display:flex;align-items:center;justify-content:space-between;
  padding:1.2rem 0 1rem;border-bottom:1px solid var(--border);margin-bottom:1.2rem;flex-wrap:wrap;row-gap:8px;}
.header-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
@media(max-width:480px){
  .header-logo{font-size:18px}
  .header-back{font-size:11px;padding:5px 9px}
}
.header-logo{font-family:Barlow Condensed,sans-serif;font-size:22px;font-weight:900;letter-spacing:3px;
  text-transform:uppercase;color:var(--gold)}
.header-logo span{color:var(--text);opacity:.5}
.header-back{background:none;border:1px solid var(--border);color:var(--muted);
  font-family:Barlow Condensed,sans-serif;font-size:12px;font-weight:700;letter-spacing:1.5px;
  text-transform:uppercase;padding:6px 14px;border-radius:8px;cursor:pointer;transition:all .18s}
.header-back:hover{border-color:var(--gold);color:var(--gold)}

.page-title{width:100%;max-width:580px;font-family:Barlow Condensed,sans-serif;font-size:20px;
  font-weight:900;letter-spacing:2px;text-transform:uppercase;margin-bottom:1rem;display:flex;
  align-items:center;justify-content:space-between}
.btn-clear{background:none;border:1px solid var(--red);color:var(--red);font-family:Barlow Condensed,sans-serif;
  font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:6px 12px;
  border-radius:8px;cursor:pointer}
.btn-clear:hover{background:rgba(239,68,68,.12)}

.data-actions{width:100%;max-width:580px;display:flex;gap:10px;margin-bottom:1.2rem}
.btn-data{flex:1;background:var(--surface);border:1px solid var(--border);color:var(--text);
  font-family:Barlow Condensed,sans-serif;font-size:11px;font-weight:700;letter-spacing:1.5px;
  text-transform:uppercase;padding:9px 12px;border-radius:8px;cursor:pointer;transition:all .18s}
.btn-data:hover{border-color:var(--gold);color:var(--gold)}

.empty{
  width:100%;max-width:580px;background:var(--card);border:1.5px dashed var(--border);border-radius:20px;
  padding:3rem 1.5rem;text-align:center;
}
.empty-icon{font-size:42px;margin-bottom:1rem;opacity:.8;line-height:1}
.empty-title{font-family:Barlow Condensed,sans-serif;font-size:18px;font-weight:900;letter-spacing:1px;
  text-transform:uppercase;color:var(--text);margin-bottom:.6rem}
.empty-text{color:var(--muted);font-size:13.5px;line-height:1.6;max-width:360px;margin:0 auto 1.6rem}
.empty-cta{
  background:var(--gold);color:#0a0f1a;border:none;font-family:Barlow Condensed,sans-serif;font-size:12px;
  font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:.75rem 1.5rem;border-radius:20px;
  cursor:pointer;transition:opacity .15s;text-decoration:none;display:inline-block;
}
.empty-cta:hover{opacity:.85}

.match-list{width:100%;max-width:580px;display:flex;flex-direction:column;gap:12px}
.match-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.1rem 1.3rem;
  position:relative}
.match-date{font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
.match-teams{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.team-name{font-family:Barlow Condensed,sans-serif;font-size:15px;font-weight:700}
.team-name.winner{color:var(--gold);font-weight:900}
.vs{color:var(--muted);font-size:12px;font-weight:700}
.match-score{font-family:Barlow Condensed,sans-serif;font-size:28px;font-weight:900;color:var(--gold);
  text-align:center;margin-bottom:4px}
.set-detail{text-align:center;color:var(--muted);font-size:12px;margin-bottom:10px}
.match-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);
  border-top:1px solid var(--border);padding-top:8px}
.btn-del{position:absolute;top:10px;right:10px;background:none;border:none;color:var(--muted);
  cursor:pointer;font-size:16px;line-height:1;padding:4px}
.btn-del:hover{color:var(--red)}
.btn-pdf{width:100%;margin-top:10px;padding:.6rem;border-radius:8px;border:1px solid var(--green);
  background:none;color:var(--green);font-family:Barlow Condensed,sans-serif;font-size:12px;font-weight:700;
  letter-spacing:1.5px;text-transform:uppercase;cursor:pointer}
.btn-pdf:hover{background:rgba(34,197,94,.12)}
</style>

<script>
// Enregistrement du service worker (mode hors ligne). Échec silencieux si
// non supporté ou si le fichier n'est pas encore déployé, pour ne jamais
// bloquer le chargement normal de la page.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
</head>
<body>

<div class="header">
  <div class="header-logo">Beach<span>/</span>Stats</div>
  <div class="header-actions">
    <div class="theme-switch-wrap">
      <button class="header-back" onclick="toggleThemeMenu(event)" aria-label="Changer de theme">Theme</button>
      <div class="theme-menu" id="themeMenu">
        <button class="theme-swatch" data-theme-choice="dark" onclick="setTheme('dark')"><span class="sw sw-dark"></span>Sombre</button>
        <button class="theme-swatch" data-theme-choice="light" onclick="setTheme('light')"><span class="sw sw-light"></span>Clair</button>
        <button class="theme-swatch" data-theme-choice="neon" onclick="setTheme('neon')"><span class="sw sw-neon"></span>Neon Beach<span class="lock-badge">🔒 PRO</span></button>
        <button class="theme-swatch" data-theme-choice="sunset" onclick="setTheme('sunset')"><span class="sw sw-sunset"></span>Sunset Gold<span class="lock-badge">🔒 PRO</span></button>
        <button class="theme-swatch" data-theme-choice="lagoon" onclick="setTheme('lagoon')"><span class="sw sw-lagoon"></span>Lagon<span class="lock-badge">🔒 PRO</span></button>
        <button class="theme-swatch" data-theme-choice="magma" onclick="setTheme('magma')"><span class="sw sw-magma"></span>Magma<span class="lock-badge">🔒 PRO</span></button>
        <button class="theme-swatch" data-theme-choice="glacier" onclick="setTheme('glacier')"><span class="sw sw-glacier"></span>Glacier<span class="lock-badge">🔒 PRO</span></button>
      </div>
    </div>
    <div class="theme-switch-wrap">
      <button class="header-back" onclick="togglePrefsMenu(event)" aria-label="Préférences">⚙ Préférences</button>
      <div class="theme-menu" id="prefsMenu">
        <div class="prefs-menu-label">PDF</div>
        <button class="theme-swatch" data-pdf-style-choice="bars" onclick="setPdfStyle('bars')"><span class="sw sw-light"></span>Barres (nouveau)</button>
        <button class="theme-swatch" data-pdf-style-choice="classic" onclick="setPdfStyle('classic')"><span class="sw sw-dark"></span>Terrains (classique)</button>
      </div>
    </div>
    <button class="header-back" id="resumeMatchBtn" style="display:none" onclick="goToInProgressMatch()">▶ Reprendre le match</button>
    <button class="header-back" onclick="window.location.href='/'">← Accueil</button>
  </div>
</div>

<div class="page-title">
  <span>Historique des matchs</span>
  <button class="btn-clear" onclick="clearHistory()">🗑 Tout effacer</button>
</div>

<div class="data-actions">
  <button class="btn-data" onclick="exportHistory()">⬇ Exporter</button>
  <button class="btn-data" onclick="document.getElementById('importFile').click()">⬆ Importer</button>
  <input type="file" id="importFile" accept="application/json,.json" style="display:none" onchange="importHistory(event)">
</div>

<div id="content"></div>

const VARIANT_LBL = { cd: 'CD', rev: 'REV', amorti: 'Amorti', lobe: 'Lobé', tendu: 'Tendu', rainbow: 'Rainbow', gratte: 'Gratté', fort: 'Fort', lob: 'Lob', rush: 'Rush', smash: 'Smash' };
function variantLabel(v) { return v.split('_').map(p => VARIANT_LBL[p] || p).join(' '); }
const DEPTH_BAND_SHOTS = {
  roule: [
    { variant: 'amorti', label: 'Amorti', short: 'AMORTI' },
    { variant: 'tendu',  label: 'Tendu',  short: 'TENDU' },
    { variant: 'lobe',   label: 'Lob',    short: 'LOB' }
  ],
  smash: [
    { variant: 'gratte', label: 'Gratté', short: 'GRATTÉ' },
    { variant: 'fort',   label: 'Fort',   short: 'FORT' },
    { variant: 'lob',    label: 'Lob',    short: 'LOB' }
  ],
  defense: [
    { variant: 'amorti', label: 'Amorti', short: 'AMORTI' },
    { variant: 'tendu',  label: 'Tendu',  short: 'TENDU' },
    { variant: 'lob',    label: 'Lob',    short: 'LOB' }
  ],
  splus1: [
    { variant: 'amorti', label: 'Amorti', short: 'AMORTI' },
    { variant: 'rush',   label: 'Rush',   short: 'RUSH' },
    { variant: 'lob',    label: 'Lob',    short: 'LOB' },
    { variant: 'smash',  label: 'Smash',  short: 'SMASH' }
  ],
};
const ROULE_DEPTH_VARIANTS = DEPTH_BAND_SHOTS.roule;
const LEAF_SHOT_CATEGORIES = [];
BASE_SHOTS.forEach(s => {
  const variants = SHOT_VARIANTS[s];
  if (!variants.length) {
    LEAF_SHOT_CATEGORIES.push({ key: s, label: SHOT_BASE_LBL[s] });
  } else {
    variants.forEach(v => {
      LEAF_SHOT_CATEGORIES.push({ key: s + '_' + v, label: SHOT_BASE_LBL[s] + ' ' + variantLabel(v) });
    });
  }
});
const SHOT_LBL = {};
const ALL_SHOT_KEYS = [];
const SHOT_ZONE_KEYS = {};
BASE_SHOTS.forEach(s => {
  const variants = SHOT_VARIANTS[s];
  const prefixes = variants.length ? variants.map(v => s + '_' + v) : [s];
  const labels = variants.length ? variants.map(v => SHOT_BASE_LBL[s] + ' ' + VARIANT_LBL[v]) : [SHOT_BASE_LBL[s]];
  SHOT_ZONE_KEYS[s] = {};
  ZONES.forEach(z => SHOT_ZONE_KEYS[s][z] = []);
  prefixes.forEach((prefix, i) => {
    ZONES.forEach(z => {
      const key = prefix + '_' + z;
      SHOT_LBL[key] = labels[i] + ' Z' + z;
      ALL_SHOT_KEYS.push(key);
      SHOT_ZONE_KEYS[s][z].push(key);
    });
  });
});

function diffStats(newer, older) {
  const out = {};
  Object.keys(newer || {}).forEach(k => {
    const nv = newer[k], ov = (older || {})[k];
    if (nv && typeof nv === 'object') {
      out[k] = diffStats(nv, ov || {});
    } else {
      out[k] = (nv || 0) - (ov || 0);
    }
  });
  return out;
}

function aggregateStats(s) {
  return {
    wA: ALL_SHOT_KEYS.reduce((t,sh)=>t+(s['wA_'+sh]||0),0),
    wB: ALL_SHOT_KEYS.reduce((t,sh)=>t+(s['wB_'+sh]||0),0),
    fA: ALL_SHOT_KEYS.reduce((t,sh)=>t+(s['fA_'+sh]||0),0),
    fB: ALL_SHOT_KEYS.reduce((t,sh)=>t+(s['fB_'+sh]||0),0),
    pA: s.pA || 0,
    pB: s.pB || 0,
  };
}

function loadHistory() {
  let hist = [];
  try { hist = JSON.parse(localStorage.getItem('beachstats_history')) || []; } catch(e) { hist = []; }
  return hist.sort((a,b) => b.id - a.id); // plus récent en premier
}

// ── EXPORT / IMPORT DE L'HISTORIQUE ─────────────────────────────────────────
// Tout l'historique vit dans le localStorage du navigateur : il disparaît si
// on change d'appareil, de navigateur, ou qu'on vide le cache. Ces deux
// fonctions permettent de le sauvegarder dans un fichier, et de le
// réimporter plus tard (sur ce même appareil ou un autre).
function exportHistory() {
  const hist = loadHistory();
  if (!hist.length) {
    alert('Aucun match à exporter pour le moment.');
    return;
  }
  const payload = {
    app: 'BeachStats',
    exportedAt: new Date().toISOString(),
    version: 1,
    matches: hist,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'BeachStats_Historique_' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importHistory(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    let data;
    try {
      data = JSON.parse(e.target.result);
    } catch (err) {
      alert("Ce fichier n'est pas lisible : ce n'est pas un export BeachStats valide.");
      event.target.value = '';
      return;
    }

    // Accepte à la fois le format d'export ({matches:[...]}) et un simple
    // tableau brut, au cas où quelqu'un modifie le fichier à la main.
    const incoming = Array.isArray(data) ? data : data.matches;
    if (!Array.isArray(incoming)) {
      alert("Ce fichier n'est pas un export BeachStats valide.");
      event.target.value = '';
      return;
    }

    // Fusion avec l'historique déjà présent sur cet appareil, sans doublons
    // (un match déjà connu — même id — n'est pas réimporté par-dessus).
    const existing = loadHistory();
    const existingIds = new Set(existing.map(m => m.id));
    let added = 0;
    incoming.forEach(m => {
      if (m && typeof m === 'object' && m.id != null && !existingIds.has(m.id)) {
        existing.push(m);
        existingIds.add(m.id);
        added++;
      }
    });

    try {
      localStorage.setItem('beachstats_history', JSON.stringify(existing));
    } catch (err) {
      alert("Impossible d'enregistrer les matchs importés (stockage plein ?).");
      event.target.value = '';
      return;
    }

    event.target.value = '';
    render();
    alert(added > 0
      ? added + ' match' + (added > 1 ? 's' : '') + ' importé' + (added > 1 ? 's' : '') + ' avec succès.'
      : 'Aucun nouveau match à importer : ils sont déjà tous présents dans ton historique.');
  };
  reader.onerror = function() {
    alert('Erreur lors de la lecture du fichier.');
    event.target.value = '';
  };
  reader.readAsText(file);
}

function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit', year:'numeric'}) +
    ' à ' + d.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
}

function render() {
  const hist = loadHistory();
  const content = document.getElementById('content');
  if (hist.length === 0) {
    content.innerHTML = '<div class="empty"><div class="empty-icon">🏖️</div><div class="empty-title">Aucun match pour l\'instant</div><div class="empty-text">Termines un match pour le voir apparaître ici, avec toutes ses statistiques et son PDF téléchargeable à tout moment.</div><a class="empty-cta" href="/">← Commencer un match</a></div>';
    return;
  }
  content.innerHTML = '<div class="match-list">' + hist.map(m => {
    const aWon = m.winner === m.nameA;
    return `
      <div class="match-card">
        <button class="btn-del" onclick="deleteMatch(${m.id})" title="Supprimer">✕</button>
        <div class="match-date">${formatDate(m.date)}</div>
        <div class="match-teams">
          <span class="team-name ${aWon ? 'winner' : ''}">${escapeHtml(m.nameA)}</span>
          <span class="vs">VS</span>
          <span class="team-name ${!aWon ? 'winner' : ''}">${escapeHtml(m.nameB)}</span>
        </div>
        <div class="match-score">${escapeHtml(m.sets)}</div>
        ${m.setDetail ? `<div class="set-detail">${escapeHtml(m.setDetail)}</div>` : ''}
        <div class="match-meta">
          <span>⏱ ${escapeHtml(m.duration || '—')}</span>
          <span>Winners ${m.stats.wA}-${m.stats.wB} · Fautes ${m.stats.fA}-${m.stats.fB}</span>
        </div>
        <button class="btn-pdf" onclick="generatePDF(${m.id})">⬇ Télécharger le PDF</button>
      </div>`;
  }).join('') + '</div>';
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function deleteMatch(id) {
  let hist = loadHistory().filter(m => m.id !== id);
  localStorage.setItem('beachstats_history', JSON.stringify(hist));
  render();
}

function clearHistory() {
  if (!confirm('Supprimer tout l\'historique des matchs ? Cette action est irréversible.')) return;
  localStorage.removeItem('beachstats_history');
  render();
}

// ── GÉNÉRATION PDF À LA DEMANDE ──────────────────────────────────────────────
// On ne stocke jamais le PDF lui-même (trop lourd pour localStorage) : il est
// reconstruit à partir des données du match au moment où l'utilisateur clique.
// Deux versions possibles :
//  - generateProPDF : pour les matchs Stats Pro sauvegardés avec les données
//    complètes (détail par coup, cartographie par zone) — le même PDF riche
//    que celui téléchargeable en direct depuis le match.
//  - generateSimplePDF : pour tous les autres matchs (ou les anciens matchs
//    Pro sauvegardés avant cette fonctionnalité, sans les données complètes).
function generatePDF(id) {
  const record = loadHistory().find(m => m.id === id);
  if (!record) return;
  if (record.page === 'Spro' && record.statsFull) {
    generateProPDF(record);
  } else if ((record.page === 'Savancee' || record.page === 'Sintermediaire') && record.statsFull) {
    const subtitle = record.page === 'Savancee' ? 'STATS AVANCÉES' : 'STATS INTERMÉDIAIRES';
    const savePrefix = record.page === 'Savancee' ? 'BeachStats_Avancees_' : 'BeachStats_Intermediaires_';
    generateShotPDF(record, subtitle, savePrefix);
  } else {
    generateSimplePDF(record);
  }
}

function generateSimplePDF(record) {
  const {jsPDF} = window.jspdf;

  const theme = PDF_THEME;
  const W = 210, M = 20;
  let y = M;

  function fillPageBackground() {
    const bands = 50;
    const bandH = 297 / bands;
    for (let i = 0; i < bands; i++) {
      const t = i / (bands - 1);
      const r = Math.round(theme.bgTop[0] + (theme.bgBottom[0]-theme.bgTop[0]) * t);
      const g = Math.round(theme.bgTop[1] + (theme.bgBottom[1]-theme.bgTop[1]) * t);
      const b = Math.round(theme.bgTop[2] + (theme.bgBottom[2]-theme.bgTop[2]) * t);
      doc.setFillColor(r, g, b);
      doc.rect(0, i*bandH, W, bandH+0.3, 'F');
    }
  }
  const newPage = () => { doc.addPage(); fillPageBackground(); y = M; };
  const ensureSpace = (needed) => { if (y + needed > 282) newPage(); };
  const stripEmoji = (str) => String(str)
    .replace(/[\u{1F1E6}-\u{1FFFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{2190}-\u{21FF}\uFE0F\u200D]/gu, '')
    .replace(/\s+/g, ' ').trim();

      const g = Math.round(255 - (255-color[1])*intensity);
      const b = Math.round(255 - (255-color[2])*intensity);
      doc.setFillColor(r, g, b);
      doc.rect(M-4 + i*stepW, y-6, stepW+0.3, 12, 'F');

    doc.roundedRect(M-4, y-6, 1.8, 12, 0.7, 0.7, 'F');

    doc.text(title, M+2, y+1.8);
    y += 12;
  };

  // Fond alterné discret pour une ligne de tableau (lisibilité des longues listes)
  const stripe = (rowY, h) => {
    doc.setFillColor(...theme.surface);
    doc.rect(M-2, rowY-4.2, W-2*M+4, h, 'F');

  doc.setDrawColor(...theme.border); doc.line(M,y,W-M,y); y += 10;

  ensureSpace(40);

   {label:'ÉQUIPE B', color:theme.orange, name:record.nameB, sets:s2, idx:1}].forEach(t => {

  }

  doc.save('BeachStats_' + record.date.slice(0,10) + '.pdf');

  fillPageBackground();

  doc.setFont(TF,'bold');
  doc.setFontSize(30); doc.setTextColor(...theme.gold);
  doc.text('BEACH TENNIS', W/2, y+9, {align:'center'});
  doc.setFont('helvetica','normal');
  doc.setFontSize(11); doc.setTextColor(...theme.muted);
  doc.text('STATS PRO', W/2, y+17, {align:'center'});
  y+=27;

  doc.setFont('helvetica','normal');
  doc.setFontSize(10); doc.setTextColor(...theme.muted);
  doc.text(new Date(record.date).toLocaleDateString('fr-FR',{weekday:'long',year:'numeric',month:'long',day:'numeric'}), W/2, y, {align:'center'});
  y+=10;
  doc.setDrawColor(...theme.border); doc.line(M,y,W-M,y); y+=10;

  const totWA = ALL_SHOT_KEYS.reduce((s,sh)=>s+stats['wA_'+sh],0);
  const totWB = ALL_SHOT_KEYS.reduce((s,sh)=>s+stats['wB_'+sh],0);
  const totFA = ALL_SHOT_KEYS.reduce((s,sh)=>s+stats['fA_'+sh],0);
  const totFB = ALL_SHOT_KEYS.reduce((s,sh)=>s+stats['fB_'+sh],0);

  ensureSpace(40);

  const scoreStr = setHistory.map(sh => {
    const wG = s1 > s2 ? sh.a : sh.b;
    const lG = s1 > s2 ? sh.b : sh.a;
    return wG + '/' + lG;
  }).join('   -   ');

  doc.setFont(TF,'bold'); doc.setFontSize(22); doc.setTextColor(...theme.gold);
  doc.text(record.winner, W/2, y, {align:'center'}); y+=9;
  doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.setTextColor(...theme.text);
  doc.text(scoreStr || record.sets || '—', W/2, y, {align:'center'}); y+=8;
  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(...theme.muted);
  doc.text('Durée du match : '+(record.duration || '—'), W/2, y, {align:'center'});
  y+=12;

  [{label: (record.teamLabelA && record.teamLabelA.trim()) || 'ÉQUIPE A', color:theme.blue, name:nameA, sets:s1, idx:0},
   {label: (record.teamLabelB && record.teamLabelB.trim()) || 'ÉQUIPE B', color:theme.orange, name:nameB, sets:s2, idx:1}].forEach(t => {
    const cardTop = y - 4;
    doc.setFillColor(...theme.card); doc.roundedRect(M-3, cardTop, W-2*M+6, (setHistory.length? 24:20), 1.5, 1.5, 'F');
    doc.setDrawColor(...t.color); doc.setLineWidth(0.5);
    doc.roundedRect(M-3, cardTop, W-2*M+6, (setHistory.length? 24:20), 1.5, 1.5, 'S');
    doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(...t.color);
    doc.text(t.label.toUpperCase(), M, y);
    doc.setFont('helvetica','normal'); doc.setFontSize(13); doc.setTextColor(...theme.text);
    doc.text(t.name, M, y+7);
    let setStr = setHistory.map((sh,i) => {
      const sc  = t.idx===0 ? sh.a : sh.b;
      const opp = t.idx===0 ? sh.b : sh.a;
      return 'S'+(i+1)+': '+sc+(sc>opp?'*':'');
    }).join('  ');
    if (setStr) { doc.setFontSize(9); doc.setTextColor(...theme.muted); doc.text(setStr, M, y+13); }
    doc.setFont(TF,'bold'); doc.setFontSize(22); doc.setTextColor(...theme.gold);
    doc.text(t.sets+' set'+(t.sets>1?'s':''), W-M, y+6, {align:'right'});
    y += setStr ? 26 : 22;
  });
  y+=6;

  sectionTitle('POINTS GAGNANTS & FAUTES DIRECTES — PAR ÉQUIPE', theme.gold);

  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(...theme.muted);
  doc.text('Statistique', M, y);
  doc.text('Éq.A', W/2, y, {align:'center'});
  doc.text('Éq.B', W-M, y, {align:'right'});
  y+=4; doc.setDrawColor(...theme.border); doc.line(M,y,W-M,y); y+=5;
  [['Points gagnants', totWA, totWB], ['Fautes directes', totFA, totFB], ['Points gagnés', stats.pA, stats.pB]].forEach(r => {
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(...theme.text); doc.text(r[0], M, y);
    doc.setFont('helvetica','bold');
    doc.setTextColor(...theme.blue);  doc.text(String(r[1]), W/2, y, {align:'center'});
    doc.setTextColor(...theme.orange); doc.text(String(r[2]), W-M, y, {align:'right'});
    y+=7;
  });
  doc.setDrawColor(...theme.border); doc.line(M,y,W-M,y); y+=10;

  if (setSnapshots.length > 0) {
    sectionTitle('DÉTAIL PAR SET', theme.gold);

    const shotTypeTotals = (rawDiff, wp, fp) => {
      return BASE_SHOTS.map(shotKey => {
        let w = 0, f = 0;
        ALL_SHOT_KEYS.forEach(k => {
          if (k.indexOf(shotKey + '_') === 0) {
            w += rawDiff[wp+k] || 0;
            f += rawDiff[fp+k] || 0;
          }
        });
        return { shotKey, w, f };
      }).filter(x => x.w > 0 || x.f > 0);
    };

    const playerNamesShort = [players.j1, players.j2, players.j3, players.j4];

    const setEntities = statsMode === 'joueur'
      ? [1,2,3,4].map(n => ({ name: playerNamesShort[n-1], color: n<=2?theme.blue:theme.orange, wp:'w'+n+'_', fp:'f'+n+'_' }))
      : [ {name:'ÉQUIPE A', color:theme.blue, wp:'wA_', fp:'fA_'}, {name:'ÉQUIPE B', color:theme.orange, wp:'wB_', fp:'fB_'} ];

    const setRow = (label, sh, idx, rawDiff) => {
      ensureSpace(14);
      if (idx > 0) { doc.setDrawColor(...theme.border); doc.setLineWidth(0.2); doc.line(M, y-3, W-M, y-3); }
      doc.setFont(TF,'bold'); doc.setFontSize(11); doc.setTextColor(...theme.gold);
      doc.text(label + (sh ? ' (' + sh.a + '-' + sh.b + ')' : ''), M, y);
      y += 8;

      setEntities.forEach(ent => {
        const totals = shotTypeTotals(rawDiff, ent.wp, ent.fp);
        const totW = totals.reduce((s,t)=>s+t.w,0);
        const totF = totals.reduce((s,t)=>s+t.f,0);

        ensureSpace(10);
        doc.setFont(TF,'bold'); doc.setFontSize(11); doc.setTextColor(...ent.color);
        doc.text(stripEmoji(ent.name) + '  —  Winners : ' + totW + '   Fautes : ' + totF, M+2, y);
        y += 5.5;

        doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(...theme.muted);
        const line = totals.length
          ? totals.map(t => SHOT_BASE_LBL[t.shotKey] + ' : ' + t.w + 'W/' + t.f + 'F').join('   •   ')
          : 'Aucun coup enregistré sur ce set';
        const wrapped = doc.splitTextToSize(line, W-2*M-4);
        wrapped.forEach(l => {
          ensureSpace(4);
          doc.text(l, M+2, y);
          y += 4;
        });
        y += 3;
      });

      y += 2;
    };

    setSnapshots.forEach((snap, i) => {
      const prevSnap = setSnapshots[i-1] || {};
      const rawDiff = diffStats(snap, prevSnap);
      setRow('Set ' + (i+1), setHistory[i], i, rawDiff);
    });
    doc.setDrawColor(...theme.border); doc.line(M,y,W-M,y); y+=10;
  }

  const shotTypeTotalsFull = (src, wp, fp) => {
    return BASE_SHOTS.map(shotKey => {
      let w = 0, f = 0;
      ALL_SHOT_KEYS.forEach(k => {
        if (k.indexOf(shotKey + '_') === 0) {
          w += src[wp+k] || 0;
          f += src[fp+k] || 0;
        }
      });
      return { shotKey, w, f };
    }).filter(x => x.w > 0 || x.f > 0);
  };

  const detailEntities = statsMode === 'joueur'
    ? [
        {name:players.j1, color:theme.blue,  wp:'w1_', fp:'f1_'},
        {name:players.j2, color:theme.blue,  wp:'w2_', fp:'f2_'},
        {name:players.j3, color:theme.orange, wp:'w3_', fp:'f3_'},
        {name:players.j4, color:theme.orange, wp:'w4_', fp:'f4_'},
      ]
    : [
        {name:'ÉQUIPE A', color:theme.blue,   wp:'wA_', fp:'fA_'},
        {name:'ÉQUIPE B', color:theme.orange, wp:'wB_', fp:'fB_'},
      ];

  sectionTitle(statsMode === 'joueur' ? 'DÉTAIL PAR JOUEUR' : 'DÉTAIL PAR ÉQUIPE', theme.gold);
  detailEntities.forEach(ent => {
    const totals = shotTypeTotalsFull(stats, ent.wp, ent.fp);
    const totW = totals.reduce((s,t)=>s+t.w,0);
    const totF = totals.reduce((s,t)=>s+t.f,0);
    if (totW+totF === 0) return;
    ensureSpace(14);
    doc.setFont(TF,'bold'); doc.setFontSize(11); doc.setTextColor(...ent.color);
    doc.text(stripEmoji(ent.name)+'  —  Winners : '+totW+'   Fautes : '+totF, M, y); y+=7;
    totals.forEach(t => {
      ensureSpace(6);
      doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(...theme.text);
      doc.text(SHOT_BASE_LBL[t.shotKey], M+4, y);
      doc.setTextColor(...theme.green);  doc.text('W:'+t.w, W/2-10, y, {align:'center'});
      doc.setTextColor(...theme.red); doc.text('F:'+t.f, W-M, y, {align:'right'});
      y+=5;
    });
    y+=4;
  });

  // ══ 5. DÉTAIL DES COUPS — 2 styles au choix (réglage "Préférences") ═════
  if (pdfStyle === 'classic') {
    // ── Style classique : terrains par zone, reskinné sur le thème clair ──
    sectionTitle('CARTOGRAPHIE PAR ZONE', theme.gold);

    // Couleurs fixes et bien saturées pour les zones : la lisibilité
    // fonctionnelle (vert/orange/rouge) prime ici, indépendamment de la
    // palette générale du PDF. Le "vide" utilise un gris chaud clair,
    // visible sur le nouveau fond clair (contrairement à theme.card qui
    // serait presque blanc sur blanc).
    const ZONE_WIN   = [34, 160, 92];
    const ZONE_TIE   = [214, 138, 20];
    const ZONE_FAULT = [196, 58, 52];
    const ZONE_EMPTY = [234, 228, 213];
    const zoneTextColor = (w, f) => (w === 0 && f === 0) ? theme.muted : [255, 255, 255];

    const drawZoneLegend = (yPos) => {
      const items = [
        {color: ZONE_WIN,   label: 'Gagnante'},
        {color: ZONE_TIE,   label: 'Égalité'},
        {color: ZONE_FAULT, label: 'Fautes'},
        {color: ZONE_EMPTY, label: 'Aucune donnée'},
      ];
      doc.setFont('helvetica','normal'); doc.setFontSize(8);
      let lx = M;
      items.forEach(it => {
        doc.setFillColor(...it.color);
        doc.setDrawColor(...theme.border); doc.setLineWidth(0.2);
        doc.rect(lx, yPos-3.2, 3.6, 3.6, 'FD');
        doc.setTextColor(...theme.muted);
        doc.text(it.label, lx+5, yPos);
        lx += 5 + doc.getTextWidth(it.label) + 7;
      });
    };
    drawZoneLegend(y);
    y += 8;

    const zoneEntities = statsMode === 'joueur'
      ? [
          {label: players.j1, color:theme.blue, wp:'w1_', fp:'f1_'},
          {label: players.j2, color:theme.blue, wp:'w2_', fp:'f2_'},
          {label: players.j3, color:theme.orange, wp:'w3_', fp:'f3_'},
          {label: players.j4, color:theme.orange, wp:'w4_', fp:'f4_'},
        ]
      : [
          {label: nameA, color:theme.blue, wp:'wA_', fp:'fA_'},
          {label: nameB, color:theme.orange, wp:'wB_', fp:'fB_'},
        ];

    const gridCols = zoneEntities.length > 2 ? 2 : zoneEntities.length;
    const gridRows = Math.ceil(zoneEntities.length / gridCols);
    const zcGap = 8;
    const zcNetGap = 5;
    const NON_ROULE_RATIO = 1.8;
    const PER_BAND_RATIO = 2/3;

    const zoneColor = (w, f) => {
      if (w === 0 && f === 0) return ZONE_EMPTY;
      if (w === f) return ZONE_TIE;
      return w > f ? ZONE_WIN : ZONE_FAULT;
    };

    BASE_SHOTS.forEach((shotKey, shotIdx) => {
      const depthBands = DEPTH_BAND_SHOTS[shotKey];
      const nBands = depthBands ? depthBands.length : 0;

      const maxCourtLFromHeight = (244 / gridRows) - 22;
      const maxWFromHeight = depthBands ? maxCourtLFromHeight / (PER_BAND_RATIO * nBands) : maxCourtLFromHeight / NON_ROULE_RATIO;
      const maxWFromWidth = (W - 2*M - (gridCols-1)*zcGap) / gridCols;
      const zcCourtW = Math.min(maxWFromWidth, maxWFromHeight);
      const courtL = depthBands ? zcCourtW * PER_BAND_RATIO * nBands : zcCourtW * NON_ROULE_RATIO;
      const bandH = depthBands ? courtL / nBands : null;
      const visualOrder = depthBands ? [...depthBands].reverse() : null;

      const blockHeight = 10 + gridRows * (courtL + 22) + 8;
      ensureSpace(blockHeight);

      doc.setFont(TF,'bold'); doc.setFontSize(12); doc.setTextColor(...theme.gold);
      doc.text(SHOT_BASE_LBL[shotKey].toUpperCase(), M, y);
      doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(...theme.muted);
      doc.text('Coup ' + (shotIdx+1) + ' / ' + BASE_SHOTS.length, W-M, y, {align:'right'});
      y += 10;

      zoneEntities.forEach((ent, i) => {
        const col = i % gridCols, row = Math.floor(i / gridCols);
        const x0 = M + col * (zcCourtW + zcGap);
        const rowLabelY = y + row * (courtL + 22);
        const courtTop = rowLabelY + 5;
        const zw = zcCourtW / 5;

        doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(...ent.color);
        doc.text(stripEmoji(ent.label), x0 + zcCourtW/2, rowLabelY, {align:'center'});

        if (depthBands) {
          visualOrder.forEach((dv, bi) => {
            const bandTop = courtTop + bi * bandH;
            ZONES.forEach(z => {
              const zi = parseInt(z, 10);
              const suffix = '_' + dv.variant + '_' + z;
              let w = 0, f = 0;
              ALL_SHOT_KEYS.forEach(k => {
                if (k.indexOf(shotKey + '_') === 0 && k.endsWith(suffix)) {
                  w += stats[ent.wp+k] || 0;
                  f += stats[ent.fp+k] || 0;
                }
              });
              const zx = x0 + zcCourtW - zi * zw;
              doc.setFillColor(...zoneColor(w, f));
              doc.rect(zx, bandTop, zw, bandH, 'F');
              const tc = zoneTextColor(w, f);
              doc.setFont('helvetica','bold'); doc.setFontSize(zw > 14 ? 9 : 6); doc.setTextColor(...tc);
              doc.text(String(zi), zx + zw/2, bandTop + Math.min(bandH - 2, 9), {align:'center'});
              doc.setFont('helvetica','normal'); doc.setFontSize(zw > 14 ? 6.5 : 5); doc.setTextColor(...tc);
              doc.text(`${w}/${f}`, zx + zw/2, bandTop + Math.min(bandH - 2, 9) + 5, {align:'center'});
            });
            doc.setDrawColor(...theme.border); doc.setLineWidth(0.25);
            for (let k = 1; k < 5; k++) { const lx = x0 + k*zw; doc.line(lx, bandTop, lx, bandTop+bandH); }
            doc.setDrawColor(...theme.gold); doc.setLineWidth(0.35);
            doc.rect(x0, bandTop, zcCourtW, bandH);
            doc.setFont('helvetica','normal'); doc.setFontSize(6); doc.setTextColor(...theme.gold);
            doc.text(dv.short, x0 + zcCourtW/2, bandTop + bandH - 2, {align:'center'});
          });
          doc.setDrawColor(...theme.border); doc.setLineWidth(0.35); doc.rect(x0, courtTop, zcCourtW, courtL);
          doc.setDrawColor(...theme.gold); doc.setLineWidth(0.5);
          doc.line(x0, courtTop+courtL+zcNetGap, x0+zcCourtW, courtTop+courtL+zcNetGap);
          doc.setFont('helvetica','normal'); doc.setFontSize(6.5); doc.setTextColor(...theme.gold);
          doc.text('FILET', x0, courtTop+courtL+zcNetGap+5);
        } else {
          ZONES.forEach(z => {
            const keys = SHOT_ZONE_KEYS[shotKey][z];
            let w = 0, f = 0;
            keys.forEach(k => { w += stats[ent.wp+k] || 0; f += stats[ent.fp+k] || 0; });
            const zi = parseInt(z, 10);
            const zx = x0 + zcCourtW - zi * zw;
            doc.setFillColor(...zoneColor(w, f));
            doc.rect(zx, courtTop, zw, courtL, 'F');
            const tc = zoneTextColor(w, f);
            doc.setFont('helvetica','bold'); doc.setFontSize(zw > 14 ? 10 : 7); doc.setTextColor(...tc);
            doc.text(String(zi), zx + zw/2, courtTop + (zw > 14 ? 10 : 7), {align:'center'});
            doc.setFont('helvetica','normal'); doc.setFontSize(zw > 14 ? 7 : 5); doc.setTextColor(...tc);
            doc.text(`${w}/${f}`, zx + zw/2, courtTop + (zw > 14 ? 18 : 13), {align:'center'});
          });
          doc.setDrawColor(...theme.border); doc.setLineWidth(0.25);
          for (let k = 1; k < 5; k++) { const lx = x0 + k*zw; doc.line(lx, courtTop, lx, courtTop+courtL); }
          doc.setDrawColor(...theme.border); doc.setLineWidth(0.35); doc.rect(x0, courtTop, zcCourtW, courtL);
          doc.setDrawColor(...theme.gold); doc.setLineWidth(0.5);
          doc.line(x0, courtTop+courtL+zcNetGap, x0+zcCourtW, courtTop+courtL+zcNetGap);
          doc.setFont('helvetica','normal'); doc.setFontSize(6.5); doc.setTextColor(...theme.gold);
          doc.text('FILET', x0, courtTop+courtL+zcNetGap+5);
        }
      });

      y += gridRows * (courtL + 22) + 4;
      doc.setDrawColor(...theme.border); doc.setLineWidth(0.2);
      doc.line(M, y, W-M, y);
      y += 8;
    });

  } else {
  // ── Style nouveau (par défaut) : barres de distribution ──
  // Une barre horizontale par coup précis (27 catégories : Service, S+1 ×4,
  // Retour ×2, Smash ×3, Bras roulé ×3, Amorti ×2, Lob ×3, Rush ×3,
  // Défense ×6), triées du meilleur au moins bon taux de réussite. La
  // longueur de la barre montre la fréquence d'utilisation, sa composition
  // (vert/rouge) le taux de réussite — c'est ce qui permet de repérer en un
  // coup d'œil les coups qui fonctionnent et ceux à travailler, y compris
  // par zone. 6 vues au total (globale, puis Zone 1 à 5).
  sectionTitle('DISTRIBUTION & TAUX DE RÉUSSITE PAR COUP', theme.gold);
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(...theme.muted);
  const introText2 = "Chaque ligne représente un type de coup précis, trié du meilleur au moins bon taux de réussite. La longueur de la barre indique le nombre total de fois où ce coup a été joué.";
  const introLines2 = doc.splitTextToSize(introText2, W - 2*M);
  introLines2.forEach(l => { ensureSpace(5); doc.text(l, M, y); y += 4.2; });
  y += 2;

  ensureSpace(8);
  doc.setFillColor(...theme.green); doc.circle(M+1.5, y-1.6, 1.5, 'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(...theme.green);
  doc.text('Coups gagnants', M+6, y);
  const legendGap2 = M + 6 + doc.getTextWidth('Coups gagnants') + 10;
  doc.setFillColor(...theme.red); doc.circle(legendGap2+1.5, y-1.6, 1.5, 'F');
  doc.setTextColor(...theme.red);
  doc.text('Fautes directes', legendGap2+6, y);
  y += 9;

  const barEntities = statsMode === 'joueur'
    ? [
        {label: players.j1, color:theme.blue, wp:'w1_', fp:'f1_'},
        {label: players.j2, color:theme.blue, wp:'w2_', fp:'f2_'},
        {label: players.j3, color:theme.orange, wp:'w3_', fp:'f3_'},
        {label: players.j4, color:theme.orange, wp:'w4_', fp:'f4_'},
      ]
    : [
        {label: nameA, color:theme.blue, wp:'wA_', fp:'fA_'},
        {label: nameB, color:theme.orange, wp:'wB_', fp:'fB_'},
      ];

  // Totaux par catégorie de coup pour une entité, toutes zones confondues ou
  // filtrés sur une zone précise (zoneFilter = null -> vue globale).
  const computeCategoryTotals2 = (wp, fp, zoneFilter) => {
    const zones = zoneFilter ? [zoneFilter] : ZONES;
    return LEAF_SHOT_CATEGORIES.map(cat => {
      let w = 0, f = 0;
      zones.forEach(z => {
        const k = cat.key + '_' + z;
        w += stats[wp+k] || 0;
        f += stats[fp+k] || 0;
      });
      return { ...cat, w, f };
    });
  };

  const barViews = [
    { label: 'VUE GLOBALE — TOUTES ZONES CONFONDUES', zoneFilter: null },
    ...ZONES.map(z => ({ label: 'ZONE ' + z, zoneFilter: z })),
  ];

  const labelColW = 40;
  const pctColW = 20;
  const barRowH = 6.4;
  const barGap = 1.2;

  barViews.forEach((view, viewIdx) => {
    ensureSpace(16);
    doc.setFont(TF,'bold'); doc.setFontSize(12); doc.setTextColor(...theme.gold);
    doc.text(view.label, M, y);
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(...theme.muted);
    doc.text('Vue ' + (viewIdx+1) + ' / ' + barViews.length, W-M, y, {align:'right'});
    y += 10;

    barEntities.forEach((ent, entIdx) => {
      const totals = computeCategoryTotals2(ent.wp, ent.fp, view.zoneFilter)
        .filter(c => (c.w + c.f) > 0)
        .sort((a, b) => (b.w / (b.w + b.f)) - (a.w / (a.w + a.f)));
      const totW = totals.reduce((s,c)=>s+c.w,0);
      const totF = totals.reduce((s,c)=>s+c.f,0);

      ensureSpace(14);
      doc.setFont(TF,'bold'); doc.setFontSize(10.5); doc.setTextColor(...ent.color);
      doc.text(stripEmoji(ent.label) + '  —  Coups gagnants : ' + totW + '   Fautes directes : ' + totF, M, y);
      y += 7;

      if (!totals.length) {
        doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(...theme.muted);
        doc.text('Aucun coup enregistré sur cette vue', M+2, y);
        y += 7;
      } else {
        const maxTotal = Math.max(...totals.map(c => c.w + c.f));
        const barAreaX = M + labelColW;
        const barAreaMaxW = W - M - barAreaX - pctColW;

        // Barre "pilule" avec dégradé doux (clair en haut, plus soutenu en bas)
        // et extrémités arrondies, plutôt qu'un aplat aux angles vifs.
        const drawGradientSegment = (sx, sw, colorLight, colorDark) => {
          if (sw <= 0) return;
          const bands = 6;
          const bandH = barRowH / bands;
          for (let bi = 0; bi < bands; bi++) {
            const t = bi / (bands - 1);
            const r = Math.round(colorLight[0] + (colorDark[0]-colorLight[0])*t);
            const g = Math.round(colorLight[1] + (colorDark[1]-colorLight[1])*t);
            const b = Math.round(colorLight[2] + (colorDark[2]-colorLight[2])*t);
            doc.setFillColor(r, g, b);
            doc.rect(sx, y + bi*bandH, sw, bandH + 0.2, 'F');
          }
        };
        const drawPillBar = (x0, greenW2, redW2) => {
          const totalW = greenW2 + redW2;
          if (totalW <= 0.5) return;
          drawGradientSegment(x0, greenW2, theme.greenLight, theme.greenDark);
          drawGradientSegment(x0 + greenW2, redW2, theme.redLight, theme.redDark);
          const capR = barRowH / 2;
          doc.setFillColor(...(greenW2 > 0 ? theme.greenDark : theme.redDark));
          doc.circle(x0, y + barRowH/2, capR, 'F');
          doc.setFillColor(...(redW2 > 0 ? theme.redDark : theme.greenDark));
          doc.circle(x0 + totalW, y + barRowH/2, capR, 'F');
        };

        totals.forEach(cat => {
          ensureSpace(barRowH + barGap);
          const total = cat.w + cat.f;
          const pct = total > 0 ? (cat.w / total * 100) : 0;
          const barW = maxTotal > 0 ? (total / maxTotal) * barAreaMaxW : 0;
          const greenW = total > 0 ? barW * (cat.w / total) : 0;
          const redW = barW - greenW;

          doc.setFont('helvetica','normal'); doc.setFontSize(6.8); doc.setTextColor(...theme.text);
          doc.text(cat.label, M, y + barRowH/2 + 1.3, {maxWidth: labelColW - 3});

          if (barW > 0.5) {
            drawPillBar(barAreaX, greenW, redW);
            doc.setFont('helvetica','bold'); doc.setFontSize(6); doc.setTextColor(255,255,255);
            if (greenW > 6) doc.text(String(cat.w), barAreaX + greenW/2, y + barRowH/2 + 1.2, {align:'center'});
            if (redW > 6) doc.text(String(cat.f), barAreaX + greenW + redW/2, y + barRowH/2 + 1.2, {align:'center'});
          }

          doc.setFont('helvetica','bold'); doc.setFontSize(7); doc.setTextColor(...(pct >= 50 ? theme.green : theme.red));
          doc.text(Math.round(pct) + '%', barAreaX + barW + barRowH/2 + 1.8, y + barRowH/2 + 1.2);

          y += barRowH + barGap;
        });
      }
      y += 5;
      if (entIdx < barEntities.length - 1) {
        doc.setDrawColor(...theme.border); doc.setLineWidth(0.15); doc.line(M, y-3, W-M, y-3);
      }
    });

    if (viewIdx < barViews.length - 1) {
      doc.setDrawColor(...theme.gold); doc.setLineWidth(0.4);
      doc.line(M, y, W-M, y);
      y += 8;
    }
  });
  y += 4;
  } // fin du else (style "barres")

  sectionTitle('JOURNAL DU MATCH COMPLET', theme.gold);
  let logIdx = 0;
  [...matchLog].reverse().forEach(entry => {
    ensureSpace(7);
    if (logIdx % 2 === 0) stripe(y, 6.5);
    logIdx++;
    let cleanMsg = stripEmoji(entry.msg);
    if (entry.type === 'winner') cleanMsg = 'Point gagnant — ' + cleanMsg;
    else if (entry.type === 'faute') cleanMsg = 'Faute — ' + cleanMsg;
    doc.setFont('helvetica','normal'); doc.setFontSize(9);
    doc.setTextColor(...theme.muted); doc.text(entry.time, M, y);
    doc.setTextColor(...theme.text);
    doc.text((entry.team ? stripEmoji(entry.team)+' — ':'')+cleanMsg, M+16, y);
    y+=6.5;
  });

  doc.save('BeachStats_Pro_'+record.date.slice(0,10)+'.pdf');
}

function generateShotPDF(record, subtitle, savePrefix) {
  const {jsPDF} = window.jspdf;
  const doc = new jsPDF({orientation:'portrait', unit:'mm', format:'a4'});
  embedTitleFont(doc);
  const TF = titleFontName();
  const theme = PDF_THEME;
  const W=210, M=20;
  let y=M;

  const stats = record.statsFull;
  const setSnapshots = record.setSnapshotsFull || [];
  const setHistory = record.setHistory || [];
  const matchLog = record.matchLog || [];
  const players = record.players || {j1:'Joueur 1',j2:'Joueur 2',j3:'Joueur 3',j4:'Joueur 4'};
  const statsMode = record.mode || 'equipe';
  const nameA = record.nameA, nameB = record.nameB;
  const [s1, s2] = (record.sets || '0-0').split('-').map(Number);

  function fillPageBackground() {
    const bands = 50;
    const bandH = 297 / bands;
    for (let i = 0; i < bands; i++) {
      const t = i / (bands - 1);
      const r = Math.round(theme.bgTop[0] + (theme.bgBottom[0]-theme.bgTop[0]) * t);
      const g = Math.round(theme.bgTop[1] + (theme.bgBottom[1]-theme.bgTop[1]) * t);
      const b = Math.round(theme.bgTop[2] + (theme.bgBottom[2]-theme.bgTop[2]) * t);
      doc.setFillColor(r, g, b);
      doc.rect(0, i*bandH, W, bandH+0.3, 'F');
    }
  }
  const newPage = () => { doc.addPage(); fillPageBackground(); y = M; };
  const ensureSpace = (needed) => { if (y + needed > 282) newPage(); };
  const stripEmoji = (str) => String(str)
    .replace(/[\u{1F1E6}-\u{1FFFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{2190}-\u{21FF}\uFE0F\u200D]/gu, '')
    .replace(/\s+/g, ' ').trim();
  const sectionTitle = (title, color) => {
    ensureSpace(18);
    const bandW = W - 2*M + 8;
    const steps = 22;
    const stepW = bandW / steps;
    for (let i = 0; i < steps; i++) {
      const t = i / (steps - 1);
      const intensity = 0.22 * (1 - t*0.85);
      const r = Math.round(255 - (255-color[0])*intensity);
      const g = Math.round(255 - (255-color[1])*intensity);
      const b = Math.round(255 - (255-color[2])*intensity);
      doc.setFillColor(r, g, b);
      doc.rect(M-4 + i*stepW, y-6, stepW+0.3, 12, 'F');
    }
    doc.setFillColor(...color);
    doc.roundedRect(M-4, y-6, 1.8, 12, 0.7, 0.7, 'F');
    doc.setFont(TF,'bold'); doc.setFontSize(13); doc.setTextColor(...color);
    doc.text(title, M+2, y+1.8);
    y += 12;
  };
  const stripe = (rowY, h) => { doc.setFillColor(...theme.surface); doc.rect(M-2, rowY-4.2, W-2*M+4, h, 'F'); };

  fillPageBackground();

  doc.setFont(TF,'bold'); doc.setFontSize(30); doc.setTextColor(...theme.gold);
  doc.text('BEACH TENNIS', W/2, y+9, {align:'center'});
  doc.setFont('helvetica','normal'); doc.setFontSize(11); doc.setTextColor(...theme.muted);
  doc.text(subtitle, W/2, y+17, {align:'center'});
  y+=27;

  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(...theme.muted);
  doc.text(new Date(record.date).toLocaleDateString('fr-FR',{weekday:'long',year:'numeric',month:'long',day:'numeric'}), W/2, y, {align:'center'});
  y+=10;
  doc.setDrawColor(...theme.border); doc.line(M,y,W-M,y); y+=10;

  const totWA = ALL_SHOT_KEYS.reduce((s,sh)=>s+stats['wA_'+sh],0);
  const totWB = ALL_SHOT_KEYS.reduce((s,sh)=>s+stats['wB_'+sh],0);
  const totFA = ALL_SHOT_KEYS.reduce((s,sh)=>s+stats['fA_'+sh],0);
  const totFB = ALL_SHOT_KEYS.reduce((s,sh)=>s+stats['fB_'+sh],0);

  ensureSpace(40);

  const scoreStr = setHistory.map(sh => {
    const wG = s1 > s2 ? sh.a : sh.b;
    const lG = s1 > s2 ? sh.b : sh.a;
    return wG + '/' + lG;
  }).join('   -   ');

  doc.setFont(TF,'bold'); doc.setFontSize(22); doc.setTextColor(...theme.gold);
  doc.text(record.winner, W/2, y, {align:'center'}); y+=9;
  doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.setTextColor(...theme.text);
  doc.text(scoreStr || record.sets || '—', W/2, y, {align:'center'}); y+=8;
  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(...theme.muted);
  doc.text('Durée du match : '+(record.duration || '—'), W/2, y, {align:'center'});
  y+=12;

  [{label: (record.teamLabelA && record.teamLabelA.trim()) || 'ÉQUIPE A', color:theme.blue, name:nameA, sets:s1, idx:0},
   {label: (record.teamLabelB && record.teamLabelB.trim()) || 'ÉQUIPE B', color:theme.orange, name:nameB, sets:s2, idx:1}].forEach(t => {
    const cardTop = y - 4;
    doc.setFillColor(...theme.card); doc.roundedRect(M-3, cardTop, W-2*M+6, (setHistory.length? 24:20), 1.5, 1.5, 'F');
    doc.setDrawColor(...t.color); doc.setLineWidth(0.5);
    doc.roundedRect(M-3, cardTop, W-2*M+6, (setHistory.length? 24:20), 1.5, 1.5, 'S');
    doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(...t.color);
    doc.text(t.label.toUpperCase(), M, y);
    doc.setFont('helvetica','normal'); doc.setFontSize(13); doc.setTextColor(...theme.text);
    doc.text(t.name, M, y+7);
    let setStr = setHistory.map((sh,i) => {
      const sc  = t.idx===0 ? sh.a : sh.b;
      const opp = t.idx===0 ? sh.b : sh.a;
      return 'S'+(i+1)+': '+sc+(sc>opp?'*':'');
    }).join('  ');
    if (setStr) { doc.setFontSize(9); doc.setTextColor(...theme.muted); doc.text(setStr, M, y+13); }
    doc.setFont(TF,'bold'); doc.setFontSize(22); doc.setTextColor(...theme.gold);
    doc.text(t.sets+' set'+(t.sets>1?'s':''), W-M, y+6, {align:'right'});
    y += setStr ? 26 : 22;
  });
  y+=6;

  sectionTitle('POINTS GAGNANTS & FAUTES DIRECTES — PAR ÉQUIPE', theme.gold);

  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(...theme.muted);
  doc.text('Statistique', M, y);
  doc.text('Éq.A', W/2, y, {align:'center'});
  doc.text('Éq.B', W-M, y, {align:'right'});
  y+=4; doc.setDrawColor(...theme.border); doc.line(M,y,W-M,y); y+=5;
  [['Points gagnants', totWA, totWB], ['Fautes directes', totFA, totFB], ['Points gagnés', stats.pA, stats.pB]].forEach(r => {
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(...theme.text); doc.text(r[0], M, y);
    doc.setFont('helvetica','bold');
    doc.setTextColor(...theme.blue);  doc.text(String(r[1]), W/2, y, {align:'center'});
    doc.setTextColor(...theme.orange); doc.text(String(r[2]), W-M, y, {align:'right'});
    y+=7;
  });
  doc.setDrawColor(...theme.border); doc.line(M,y,W-M,y); y+=10;

  if (setSnapshots.length > 0) {
    sectionTitle('DÉTAIL PAR SET', theme.gold);

    const shotTypeTotals = (rawDiff, wp, fp) => {
      return BASE_SHOTS.map(shotKey => {
        let w = 0, f = 0;
        ALL_SHOT_KEYS.forEach(k => {
          if (k.indexOf(shotKey + '_') === 0) {
            w += rawDiff[wp+k] || 0;
            f += rawDiff[fp+k] || 0;
          }
        });
        return { shotKey, w, f };
      }).filter(x => x.w > 0 || x.f > 0);
    };

    const playerNamesShort = [players.j1, players.j2, players.j3, players.j4];

    const setEntities = statsMode === 'joueur'
      ? [1,2,3,4].map(n => ({ name: playerNamesShort[n-1], color: n<=2?theme.blue:theme.orange, wp:'w'+n+'_', fp:'f'+n+'_' }))
      : [ {name:'ÉQUIPE A', color:theme.blue, wp:'wA_', fp:'fA_'}, {name:'ÉQUIPE B', color:theme.orange, wp:'wB_', fp:'fB_'} ];

    const setRow = (label, sh, idx, rawDiff) => {
      ensureSpace(14);
      if (idx > 0) { doc.setDrawColor(...theme.border); doc.setLineWidth(0.2); doc.line(M, y-3, W-M, y-3); }
      doc.setFont(TF,'bold'); doc.setFontSize(11); doc.setTextColor(...theme.gold);
      doc.text(label + (sh ? ' (' + sh.a + '-' + sh.b + ')' : ''), M, y);
      y += 8;

      setEntities.forEach(ent => {
        const totals = shotTypeTotals(rawDiff, ent.wp, ent.fp);
        const totW = totals.reduce((s,t)=>s+t.w,0);
        const totF = totals.reduce((s,t)=>s+t.f,0);

        ensureSpace(10);
        doc.setFont(TF,'bold'); doc.setFontSize(11); doc.setTextColor(...ent.color);
        doc.text(stripEmoji(ent.name) + '  —  Winners : ' + totW + '   Fautes : ' + totF, M+2, y);
        y += 5.5;

        doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(...theme.muted);
        const line = totals.length
          ? totals.map(t => SHOT_BASE_LBL[t.shotKey] + ' : ' + t.w + 'W/' + t.f + 'F').join('   •   ')
          : 'Aucun coup enregistré sur ce set';
        const wrapped = doc.splitTextToSize(line, W-2*M-4);
        wrapped.forEach(l => {
          ensureSpace(4);
          doc.text(l, M+2, y);
          y += 4;
        });
        y += 3;
      });

      y += 2;
    };

    setSnapshots.forEach((snap, i) => {
      const prevSnap = setSnapshots[i-1] || {};
      const rawDiff = diffStats(snap, prevSnap);
      setRow('Set ' + (i+1), setHistory[i], i, rawDiff);
    });
    doc.setDrawColor(...theme.border); doc.line(M,y,W-M,y); y+=10;
  }

  const shotTypeTotalsFull = (src, wp, fp) => {
    return BASE_SHOTS.map(shotKey => {
      let w = 0, f = 0;
      ALL_SHOT_KEYS.forEach(k => {
        if (k.indexOf(shotKey + '_') === 0) {
          w += src[wp+k] || 0;
          f += src[fp+k] || 0;
        }
      });
      return { shotKey, w, f };
    }).filter(x => x.w > 0 || x.f > 0);
  };

  const detailEntities = statsMode === 'joueur'
    ? [
        {name:players.j1, color:theme.blue,  wp:'w1_', fp:'f1_'},
        {name:players.j2, color:theme.blue,  wp:'w2_', fp:'f2_'},
        {name:players.j3, color:theme.orange, wp:'w3_', fp:'f3_'},
        {name:players.j4, color:theme.orange, wp:'w4_', fp:'f4_'},
      ]
    : [
        {name:'ÉQUIPE A', color:theme.blue,   wp:'wA_', fp:'fA_'},
        {name:'ÉQUIPE B', color:theme.orange, wp:'wB_', fp:'fB_'},
      ];

  sectionTitle(statsMode === 'joueur' ? 'DÉTAIL PAR JOUEUR' : 'DÉTAIL PAR ÉQUIPE', theme.gold);
  detailEntities.forEach(ent => {
    const totals = shotTypeTotalsFull(stats, ent.wp, ent.fp);
    const totW = totals.reduce((s,t)=>s+t.w,0);
    const totF = totals.reduce((s,t)=>s+t.f,0);
    if (totW+totF === 0) return;
    ensureSpace(14);
    doc.setFont(TF,'bold'); doc.setFontSize(11); doc.setTextColor(...ent.color);
    doc.text(stripEmoji(ent.name)+'  —  Winners : '+totW+'   Fautes : '+totF, M, y); y+=7;
    totals.forEach(t => {
      ensureSpace(6);
      doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(...theme.text);
      doc.text(SHOT_BASE_LBL[t.shotKey], M+4, y);
      doc.setTextColor(...theme.green);  doc.text('W:'+t.w, W/2-10, y, {align:'center'});
      doc.setTextColor(...theme.red); doc.text('F:'+t.f, W-M, y, {align:'right'});
      y+=5;
    });
    y+=4;
  });

  sectionTitle('JOURNAL DU MATCH COMPLET', theme.gold);
  let logIdx = 0;
  [...matchLog].reverse().forEach(entry => {
    ensureSpace(7);
    if (logIdx % 2 === 0) stripe(y, 6.5);
    logIdx++;
    let cleanMsg = stripEmoji(entry.msg);
    if (entry.type === 'winner') cleanMsg = 'Point gagnant — ' + cleanMsg;
    else if (entry.type === 'faute') cleanMsg = 'Faute — ' + cleanMsg;
    doc.setFont('helvetica','normal'); doc.setFontSize(9);
    doc.setTextColor(...theme.muted); doc.text(entry.time, M, y);
    doc.setTextColor(...theme.text);
    doc.text((entry.team ? stripEmoji(entry.team)+' — ':'')+cleanMsg, M+16, y);
    y+=6.5;
  });

  doc.save(savePrefix+record.date.slice(0,10)+'.pdf');
}

render();

// ── REPRENDRE UN MATCH EN COURS ──────────────────────────────────────────
// Chaque mode (base/avancées/intermédiaires/pro/points) sauvegarde sa propre
// progression sous sa propre clé, et l'efface automatiquement une fois le
// match terminé. Donc si une de ces clés existe encore, c'est qu'un match
// est en cours quelque part — on propose d'y retourner directement.
function findInProgressMatch() {
  const modes = [
    { key: 'beachstats_inprogress_base', page: '/base' },
    { key: 'beachstats_inprogress_avancees', page: '/avancees' },
    { key: 'beachstats_inprogress_intermediaire', page: '/intermediaire' },
    { key: 'beachstats_inprogress_pro', page: '/pro' },
    { key: 'beachstats_inprogress_points', page: '/points' },
  ];
  let best = null;
  modes.forEach(m => {
    try {
      const raw = localStorage.getItem(m.key);
      if (!raw) return;
      const snap = JSON.parse(raw);
      // Un match tout juste créé (0-0-0-0-0-0) n'est pas vraiment "en cours".
      if (snap.p1===0 && snap.p2===0 && snap.g1===0 && snap.g2===0 && snap.s1===0 && snap.s2===0) return;
      if (!best || (snap.savedAt || 0) > (best.savedAt || 0)) {
        best = { page: m.page, savedAt: snap.savedAt || 0 };
      }
    } catch(e) {}
  });
  return best;
}

function goToInProgressMatch() {
  const match = findInProgressMatch();
  if (match) window.location.href = match.page;
}

(function initResumeButton() {
  const match = findInProgressMatch();
  const btn = document.getElementById('resumeMatchBtn');
  if (match && btn) btn.style.display = 'inline-block';
})();


// ── THÈMES ────────────────────────────────────────────────────────────────
const PRO_THEMES = ['neon', 'sunset', 'lagoon', 'magma', 'glacier'];
let userTier = null;

function applyTheme(theme) { document.documentElement.setAttribute('data-theme', theme); }

function setTheme(theme) {
  if (PRO_THEMES.includes(theme) && userTier !== 'pro') {
    window.open('https://beachstats.gumroad.com/l/jlcqx', '_blank');
    return;
  }
  localStorage.setItem('beachstats_theme', theme);
  applyTheme(theme);
  document.querySelectorAll('.theme-swatch').forEach(b => b.classList.toggle('active', b.dataset.themeChoice === theme));
  document.getElementById('themeMenu')?.classList.remove('open');
}

function toggleThemeMenu(e) {
  e.stopPropagation();
  document.getElementById('themeMenu')?.classList.toggle('open');
}

document.addEventListener('click', function(e) {
  if (!e.target.closest('.theme-switch-wrap')) {
    document.getElementById('themeMenu')?.classList.remove('open');
    document.getElementById('prefsMenu')?.classList.remove('open');
  }
});

// ── PRÉFÉRENCES (style du PDF exporté) — même réglage que sur pro.html,
// partagé via localStorage pour que la régénération PDF depuis l'historique
// respecte le choix fait ailleurs dans l'appli.
let pdfStyle = localStorage.getItem('beachstats_pdf_style') || 'bars';

function refreshPrefsMenuUI() {
  document.querySelectorAll('[data-pdf-style-choice]').forEach(b => {
    b.classList.toggle('active', b.dataset.pdfStyleChoice === pdfStyle);
  });
}

function togglePrefsMenu(e) {
  e.stopPropagation();
  document.getElementById('themeMenu')?.classList.remove('open');
  document.getElementById('prefsMenu')?.classList.toggle('open');
  refreshPrefsMenuUI();
}

function setPdfStyle(style) {
  pdfStyle = style;
  try { localStorage.setItem('beachstats_pdf_style', style); } catch(e) {}
  refreshPrefsMenuUI();
  document.getElementById('prefsMenu')?.classList.remove('open');
}

function updateThemeLockUI() {
  document.querySelectorAll('.theme-swatch').forEach(b => {
    const isProTheme = PRO_THEMES.includes(b.dataset.themeChoice);
    b.classList.toggle('locked', isProTheme && userTier !== 'pro');
  });
}

async function checkTier() {
  try {
    const res = await fetch('/api/tier');
    const data = await res.json();
    userTier = data.tier;
  } catch (e) {
    userTier = null;
  }
  updateThemeLockUI();
}

document.addEventListener('DOMContentLoaded', function() {
  const current = localStorage.getItem('beachstats_theme') || 'dark';
  document.querySelectorAll('.theme-swatch').forEach(b => b.classList.toggle('active', b.dataset.themeChoice === current));
  refreshPrefsMenuUI();
  checkTier();
});
