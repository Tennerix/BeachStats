<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Administration – BeachStats</title>
<style>
:root{--bg:#0a1628;--card:#0f1d33;--border:#1e3560;--text:#e8eefb;--muted:#8ba3c7;--gold:#f5c518;--green:#22c55e;--orange:#f97316;--blue:#6aa0ff}
@media (prefers-color-scheme: light){:root{--bg:#f3f6fb;--card:#fff;--border:#d5dfef;--text:#0e1a2e;--muted:#5b6f8f;--gold:#b88a00;--green:#15803d;--orange:#c2410c;--blue:#2563eb}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px;max-width:760px;margin:0 auto}
h1{font-size:22px;margin:8px 0 2px;color:var(--gold);letter-spacing:1px}
.sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px}
.card .v{font-size:28px;font-weight:800;line-height:1.1}
.card .l{font-size:12px;color:var(--muted)}
input[type=search]{width:100%;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:12px;font-size:16px;margin-bottom:12px}
.u{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.u .e{font-weight:700;word-break:break-all}
.u .m{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-top:6px}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:700;border:1px solid var(--border)}
.pro{color:var(--blue);border-color:var(--blue)}.avancees{color:var(--gold);border-color:var(--gold)}.free{color:var(--muted)}
.u .a{display:flex;gap:8px;margin-top:10px}
.u button{flex:1;background:transparent;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:9px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.u button.danger{color:var(--orange);border-color:var(--orange)}
.u button:disabled{opacity:.5}
.banned{color:var(--orange);border-color:var(--orange)}
.ok{color:var(--green)}.no{color:var(--orange)}
.err{padding:16px;color:var(--orange)}
a{color:var(--gold)}
</style>
</head>
<body>
<h1>ADMINISTRATION</h1>
<div class="sub" id="sub">Chargement…</div>
<div class="grid" id="totals"></div>
<input type="search" id="q" placeholder="Rechercher une adresse e-mail" autocomplete="off">
<div id="list"></div>
<p class="sub"><a href="/compte">← Mon compte</a></p>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var users = [];
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function fmt(ts) { return new Date(ts).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' }); }

  function renderTotals(t) {
    var items = [
      ['Comptes', t.users], ['Confirmés', t.verified], ['Nouveaux (7 j)', t.new7],
      ['Pro', t.pro], ['Avancées', t.avancees], ['Appareils connectés', t.sessions],
      ['Matchs en cloud', t.matches], ['Suspendus', t.banned]
    ];
    var box = $('totals'); box.textContent = '';
    items.forEach(function (it) {
      var c = el('div', 'card'); c.appendChild(el('div', 'v', String(it[1]))); c.appendChild(el('div', 'l', it[0])); box.appendChild(c);
    });
  }

  function renderList() {
    var q = $('q').value.trim().toLowerCase();
    var box = $('list'); box.textContent = '';
    users.filter(function (u) { return !q || u.email.toLowerCase().indexOf(q) !== -1; }).forEach(function (u) {
      var c = el('div', 'u');
      c.appendChild(el('div', 'e', u.email));
      var m = el('div', 'm');
      var tag = el('span', 'tag ' + (u.tier || 'free'), u.tier === 'pro' ? 'Pro' : u.tier === 'avancees' ? 'Avancées' : 'Gratuit');
      m.appendChild(tag);
      m.appendChild(el('span', u.verified ? 'ok' : 'no', u.verified ? 'e-mail confirmé' : 'e-mail non confirmé'));
      m.appendChild(el('span', '', 'inscrit le ' + fmt(u.createdAt)));
      m.appendChild(el('span', '', u.devices + ' appareil' + (u.devices > 1 ? 's' : '')));
      m.appendChild(el('span', '', u.matches + ' match' + (u.matches > 1 ? 's' : '')));
      if (u.banned) m.insertBefore(el('span', 'tag banned', 'Suspendu'), m.firstChild);
      c.appendChild(m);
      if (!u.isAdmin) {
        var a = el('div', 'a');
        var bBan = el('button', '', u.banned ? 'Réactiver' : 'Suspendre');
        bBan.onclick = function () {
          if (!u.banned && !confirm('Suspendre ' + u.email + ' ? Il sera déconnecté et ne pourra plus se reconnecter.')) return;
          act('/api/admin/ban', { email: u.email, banned: !u.banned }, bBan);
        };
        var bDel = el('button', 'danger', 'Supprimer');
        bDel.onclick = function () {
          if (!confirm('Supprimer définitivement ' + u.email + ', ses matchs et son accès ? Impossible à annuler.')) return;
          act('/api/admin/delete', { email: u.email }, bDel);
        };
        a.appendChild(bBan); a.appendChild(bDel); c.appendChild(a);
      }
      box.appendChild(c);
    });
  }

  function act(path, body, btn) {
    btn.disabled = true;
    fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin', body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (r) { if (!r.ok) { alert(r.d.error || 'Erreur'); btn.disabled = false; return; } load(); })
      .catch(function () { btn.disabled = false; alert('Erreur réseau'); });
  }

  function load() { fetch('/api/admin/stats', { credentials: 'same-origin' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (d) {
      users = d.users || [];
      $('sub').textContent = d.shown + ' compte' + (d.shown > 1 ? 's' : '') + ' affiché' + (d.shown > 1 ? 's' : '') + ' (les plus récents d\'abord).';
      renderTotals(d.totals); renderList();
    })
    .catch(function () { $('sub').textContent = ''; $('list').appendChild(el('div', 'err', 'Accès refusé ou erreur de chargement.')); });
  }
  load();
  $('q').addEventListener('input', renderList);
})();
</script>
</body>
</html>
