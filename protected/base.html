<!DOCTYPE html>
<html lang="fr">
<head>
<script>(function(){var t=localStorage.getItem('beachstats_theme')||'dark';document.documentElement.setAttribute('data-theme',t);})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beach Tennis – Stats de Base</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,900;1,700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#080f1e;
  --surface:#0d1829;
  --card:#111e35;
  --border:#1e3560;
  --hover:#162040;
  --gold:#f5c518;
  --blue:#3b82f6;
  --orange:#f97316;
  --green:#22c55e;
  --red:#ef4444;
  --purple:#a855f7;
  --text:#e2eaf8;
  --muted:#4a6494;
}
[data-theme="light"]{
  --bg:#eef1f6; --surface:#e7ecf3; --card:#f7f9fc; --hover:#dde4ee; --border:#aebad2;
  --gold:#b3860f; --blue:#3b66c4; --orange:#c9601e; --green:#1f8a4c; --purple:#7c4bc4;
  --red:#c23a3a; --text:#2c3646; --muted:#748094;
}
[data-theme="neon"]{
  --bg:#050214; --surface:#0d0620; --card:#140a2e; --hover:#1c0f3d; --border:#3d1a6b;
  --gold:#ffe600; --blue:#00e5ff; --orange:#ff2e97; --green:#39ff14; --purple:#c644ff;
  --red:#ff2e5f; --text:#f2ecff; --muted:#8c6bc9;
}
[data-theme="sunset"]{
  --bg:linear-gradient(180deg,#200a12 0%,#4a1f16 22%,#b8531f 48%,#f0c542 62%,#6b2a52 84%,#241130 100%);
  --surface:linear-gradient(135deg,#3c1a14 0%,#6b3420 100%);
  --card:linear-gradient(150deg,#481f18 0%,#7a3f22 100%);
  --hover:linear-gradient(135deg,#5c2a1c 0%,#8a4a26 100%);
  --border:#a35a35;
  --gold:#ffcb3d; --blue:#5ec8f5; --orange:#ff7f3f; --green:#3fd9ae; --purple:#e488a8;
  --red:#ef4a4a; --text:#fff8ec; --muted:#e0b89f;
}
/* ── SÉLECTEUR DE THÈME ── */
body{transition:background-color .25s ease,color .25s ease}
.theme-switch-wrap{position:relative}
.theme-menu{position:absolute;top:calc(100% + 8px);left:0;background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:8px;display:none;flex-direction:column;gap:2px;z-index:30;min-width:170px;
  box-shadow:0 8px 24px rgba(0,0,0,.5)}
.theme-menu.open{display:flex}
.theme-swatch{display:flex;align-items:center;gap:8px;background:none;border:none;color:var(--text);
  font-family:Barlow,sans-serif;font-size:13px;padding:7px 8px;border-radius:6px;cursor:pointer;text-align:left;width:100%}
.theme-swatch:hover{background:var(--surface)}
.theme-swatch.active{outline:1px solid var(--gold)}
.theme-swatch.locked{opacity:.55}
.theme-swatch .lock-badge{margin-left:auto;font-size:9px;font-weight:900;letter-spacing:.5px;color:var(--gold);display:none;align-items:center;gap:2px;flex-shrink:0}
.theme-swatch.locked .lock-badge{display:flex}
.sw{width:14px;height:14px;border-radius:50%;flex-shrink:0;border:1px solid rgba(255,255,255,.25)}
.sw-dark{background:linear-gradient(135deg,#080f1e,#3b82f6)}
.sw-light{background:linear-gradient(135deg,#f7f9fc,#3b66c4)}
.sw-neon{background:linear-gradient(135deg,#050214,#ff2e97)}
.sw-sunset{background:linear-gradient(135deg,#2a130f,#ff6b1a)}

body{
  font-family:Barlow,sans-serif;
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:0 1rem 4rem;
}

/* ── HEADER ── */
.header{
  width:100%;max-width:580px;
  display:flex;align-items:center;justify-content:space-between;
  padding:1.2rem 0 1rem;
  border-bottom:1px solid var(--border);
  margin-bottom:1.2rem;flex-wrap:wrap;row-gap:8px;}
.header-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
@media(max-width:480px){
  .header-logo{font-size:18px}
  .header-back{font-size:11px;padding:5px 9px}
}
.header-logo{font-family:Barlow Condensed,sans-serif;font-size:22px;font-weight:900;letter-spacing:3px;text-transform:uppercase;color:var(--gold)}
.header-logo span{color:var(--text);opacity:.5}
.header-back{background:none;border:1px solid var(--border);color:var(--muted);font-family:Barlow Condensed,sans-serif;font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:6px 14px;border-radius:8px;cursor:pointer;transition:all .18s}
.header-back:hover{border-color:var(--gold);color:var(--gold)}

/* ── STATUS BAR ── */
.status-bar{
  width:100%;max-width:580px;
  background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:.75rem 1.4rem;display:flex;align-items:center;justify-content:center;gap:10px;
  margin-bottom:1rem;
}
.status-pill{font-family:Barlow Condensed,sans-serif;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--bg);background:var(--gold);padding:4px 14px;border-radius:20px}
.status-label{font-family:Barlow Condensed,sans-serif;font-size:14px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}

/* ── SCOREBOARD ── */
.scoreboard{
  width:100%;max-width:580px;
  background:var(--card);border:1px solid var(--border);border-radius:20px;overflow:hidden;
  box-shadow:0 8px 48px rgba(0,0,0,.5);margin-bottom:1rem;
}
.score-header{
  display:grid;grid-template-columns:1fr 44px 44px 44px 80px;
  padding:.6rem 1.4rem;background:var(--surface);border-bottom:1px solid var(--border);
}
.score-header span{font-family:Barlow Condensed,sans-serif;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);text-align:center}
.score-header span:first-child{text-align:left}
.team-row{
  display:grid;grid-template-columns:1fr 44px 44px 44px 80px;align-items:center;
  padding:1rem 1.4rem;border-bottom:1px solid var(--border);transition:background .15s;
}
.team-row:last-child{border-bottom:none}
.team-info{display:flex;flex-direction:column;gap:3px}
.team-name{font-family:Barlow Condensed,sans-serif;font-size:16px;font-weight:900;letter-spacing:1px;text-transform:uppercase}
.team-players{font-size:11px;color:var(--muted);font-weight:500}
.team-row.team-a .team-name{color:var(--blue)}
.team-row.team-b .team-name{color:var(--orange)}
.cell{text-align:center;font-family:Barlow Condensed,sans-serif;font-size:20px;font-weight:900}
.cell.sets-cell span{display:inline-block;width:28px;height:28px;line-height:28px;border-radius:50%;font-size:14px;font-weight:900}
.cell.sets-cell span.won{background:var(--gold);color:var(--bg)}
.cell.set-score{
  font-family:Barlow Condensed,sans-serif;font-size:18px;font-weight:900;
  text-align:center;color:var(--muted);
}
.cell.set-score.active{color:var(--text)}
.cell.set-score.won{color:var(--gold)}
.cell.point-cell{font-size:36px;color:var(--gold);font-style:italic}

/* ── STATS CARD ── */
.stats-card{
  width:100%;max-width:580px;
  background:var(--card);border:1px solid var(--border);border-radius:20px;
  padding:1.2rem 1.4rem;margin-bottom:1rem;
}
.stats-title{
  font-family:Barlow Condensed,sans-serif;font-size:12px;font-weight:700;
  letter-spacing:2px;text-transform:uppercase;color:var(--muted);
  margin-bottom:1rem;display:flex;align-items:center;gap:8px;
}
.stats-title::after{content:'';flex:1;height:1px;background:var(--border)}

.stat-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-bottom:.7rem}
.stat-row:last-child{margin-bottom:0}
.stat-val{
  font-family:Barlow Condensed,sans-serif;font-size:24px;font-weight:900;
}
.stat-val.a{color:var(--blue);text-align:right}
.stat-val.b{color:var(--orange);text-align:left}
.stat-name{
  font-family:Barlow Condensed,sans-serif;font-size:10px;font-weight:700;
  letter-spacing:2px;text-transform:uppercase;color:var(--muted);text-align:center;
  white-space:nowrap;
}
.stat-bar-wrap{grid-column:1/-1;display:flex;height:4px;border-radius:4px;overflow:hidden;background:var(--surface)}
.stat-bar-a{background:var(--blue);transition:width .4s}
.stat-bar-b{background:var(--orange);transition:width .4s}

/* ── ACTIONS ── */
.team-controls{width:100%;max-width:580px;margin-bottom:.8rem}
.team-ctrl-label{
  font-family:Barlow Condensed,sans-serif;font-size:11px;font-weight:700;letter-spacing:2px;
  text-transform:uppercase;margin-bottom:6px;padding-left:4px;
}
.team-ctrl-label.a{color:var(--blue)}
.team-ctrl-label.b{color:var(--orange)}
.ctrl-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-winner,.btn-faute{
  padding:.9rem .8rem;border-radius:14px;border:2px solid;cursor:pointer;
  transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:3px;line-height:1;
  font-family:Barlow Condensed,sans-serif;
}
.btn-winner:active,.btn-faute:active{transform:scale(.96)}
.btn-icon{font-size:22px}
.btn-main{font-size:16px;font-weight:900;letter-spacing:1px;text-transform:uppercase}
.btn-sub{font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;opacity:.6}
.btn-winner.a{background:rgba(34,197,94,.1);border-color:var(--green);color:var(--green)}
.btn-winner.a:hover{background:rgba(34,197,94,.22);transform:scale(1.02)}
.btn-winner.b{background:rgba(34,197,94,.1);border-color:var(--green);color:var(--green)}
.btn-winner.b:hover{background:rgba(34,197,94,.22);transform:scale(1.02)}
.btn-faute.a{background:rgba(239,68,68,.08);border-color:var(--red);color:var(--red)}
.btn-faute.a:hover{background:rgba(239,68,68,.2);transform:scale(1.02)}
.btn-faute.b{background:rgba(239,68,68,.08);border-color:var(--red);color:var(--red)}
.btn-faute.b:hover{background:rgba(239,68,68,.2);transform:scale(1.02)}

.actions{width:100%;max-width:580px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:1rem}
.btn-action{
  padding:.75rem;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);
  font-family:Barlow Condensed,sans-serif;font-size:13px;font-weight:700;letter-spacing:1.5px;
  text-transform:uppercase;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:6px;
}
.btn-action:hover{background:var(--hover);border-color:var(--muted)}
.btn-action.undo{border-color:#f59e0b;color:#f59e0b}
.btn-action.undo:hover{background:rgba(245,158,11,.12)}
.btn-action.reset{border-color:var(--red);color:var(--red)}
.btn-action.reset:hover{background:rgba(239,68,68,.12)}
.btn-action.pdf{border-color:var(--green);color:var(--green)}
.btn-action.pdf:hover{background:rgba(34,197,94,.12)}

/* ── LOG ── */
.log-wrap{width:100%;max-width:580px}
.log-title{font-family:Barlow Condensed,sans-serif;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:.6rem;padding-left:4px}
.log-list{display:flex;flex-direction:column;gap:5px;max-height:200px;overflow-y:auto}
.log-entry{
  background:var(--surface);border:1px solid var(--border);border-radius:8px;
  padding:.45rem 1rem;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;
}
.log-entry .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.log-entry.dot-a .dot{background:var(--blue)}
.log-entry.dot-b .dot{background:var(--orange)}
.log-entry.dot-w .dot{background:var(--green)}
.log-entry.dot-f .dot{background:var(--red)}
.log-entry.event .dot{background:var(--gold)}
.log-tag{
  margin-left:auto;font-family:Barlow Condensed,sans-serif;font-size:10px;font-weight:700;
  letter-spacing:1px;text-transform:uppercase;padding:2px 7px;border-radius:10px;
}
.log-tag.winner{background:rgba(34,197,94,.15);color:var(--green)}
.log-tag.faute{background:rgba(239,68,68,.15);color:var(--red)}

/* ── WINNER OVERLAY ── */
.winner-overlay{
  display:none;position:fixed;inset:0;background:rgba(8,15,30,.92);z-index:100;
  align-items:center;justify-content:center;flex-direction:column;gap:1.5rem;padding:2rem;
}
.winner-overlay.show{display:flex}
.winner-box{
  background:var(--card);border:2px solid var(--gold);border-radius:24px;
  padding:2.5rem 2rem;text-align:center;max-width:400px;width:100%;
  box-shadow:0 0 80px rgba(245,197,24,.2);
}
.winner-trophy{font-size:60px;margin-bottom:1rem}
.winner-label{font-family:Barlow Condensed,sans-serif;font-size:13px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--gold);opacity:.7;margin-bottom:.5rem}
.winner-name{font-family:Barlow Condensed,sans-serif;font-size:32px;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:#fff;margin-bottom:.4rem}
.winner-score{font-family:Barlow Condensed,sans-serif;font-size:16px;color:var(--muted);letter-spacing:1px;margin-bottom:1.2rem}
.winner-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:1.4rem}
.ws-box{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:.8rem}
.ws-val{font-family:Barlow Condensed,sans-serif;font-size:28px;font-weight:900}
.ws-val.a{color:var(--blue)}
.ws-val.b{color:var(--orange)}
.ws-lbl{font-family:Barlow Condensed,sans-serif;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-top:2px}
.winner-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.winner-btn{padding:.7rem 1.4rem;border-radius:10px;border:1.5px solid;font-family:Barlow Condensed,sans-serif;font-size:14px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;transition:all .15s}
.winner-btn.primary{border-color:var(--gold);color:var(--gold);background:rgba(245,197,24,.1)}
.winner-btn.primary:hover{background:rgba(245,197,24,.25)}
.winner-btn.secondary{border-color:var(--border);color:var(--muted);background:none}
.winner-btn.secondary:hover{border-color:var(--muted);color:var(--text)}

/* ── TIMER ── */
.timer-wrap{
  width:100%;max-width:580px;
  background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:.9rem 1.4rem;margin-bottom:1rem;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.timer-display{
  font-family:Barlow Condensed,sans-serif;font-size:38px;font-weight:900;
  letter-spacing:4px;color:var(--gold);font-variant-numeric:tabular-nums;
  min-width:110px;
}
.timer-display.running{color:#fff}
.timer-btns{display:flex;gap:8px}
.timer-btn{
  padding:.5rem 1rem;border-radius:8px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);
  font-family:Barlow Condensed,sans-serif;font-size:12px;font-weight:700;
  letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;transition:all .15s;
}
.timer-btn:hover{background:var(--hover);border-color:var(--muted)}
.timer-btn.start{border-color:var(--green);color:var(--green)}
.timer-btn.start:hover{background:rgba(34,197,94,.12)}
.timer-btn.pause{border-color:var(--gold);color:var(--gold)}
.timer-btn.pause:hover{background:rgba(245,197,24,.12)}
.timer-btn.stop{border-color:var(--red);color:var(--red)}
.timer-btn.stop:hover{background:rgba(239,68,68,.12)}

@media(max-width:440px){
  .score-header,.team-row{grid-template-columns:1fr 36px 36px 36px 64px;padding:.8rem .7rem}
  .cell.set-score{
  font-family:Barlow Condensed,sans-serif;font-size:18px;font-weight:900;
  text-align:center;color:var(--muted);
}
.cell.set-score.active{color:var(--text)}
.cell.set-score.won{color:var(--gold)}
.cell.point-cell{font-size:28px}
  .shot-btn{font-size:14px;padding:.9rem .6rem}
  .shot-btn .shot-icon{font-size:24px}
  .actions{grid-template-columns:1fr 1fr 1fr}
}
</style>
</head>
<body>

<div class="header">
  <div class="header-logo">Beach<span>/</span>Stats</div>
  <div class="header-actions">
    <div class="theme-switch-wrap">
      <button class="header-back" onclick="toggleThemeMenu(event)" aria-label="Changer de theme">Theme</button>
      <div class="theme-menu" id="themeMenu">
        <button class="theme-swatch" data-theme-choice="dark" onclick="setTheme('dark')"><span class="sw sw-dark"></span>Sombre</button>
        <button class="theme-swatch" data-theme-choice="light" onclick="setTheme('light')"><span class="sw sw-light"></span>Clair</button>
        <button class="theme-swatch" data-theme-choice="neon" onclick="setTheme('neon')"><span class="sw sw-neon"></span>Neon Beach<span class="lock-badge">🔒 PRO</span></button>
        <button class="theme-swatch" data-theme-choice="sunset" onclick="setTheme('sunset')"><span class="sw sw-sunset"></span>Sunset Gold<span class="lock-badge">🔒 PRO</span></button>
      </div>
    </div>
    <button class="header-back" onclick="window.location.href='/historique'">📋 Historique</button>
    <button class="header-back" onclick="window.location.href='/'">← Accueil</button>
  </div>
</div>

<div class="status-bar">
  <div class="status-pill" id="setPill">Set 1</div>
  <div class="status-label" id="statusLabel">En cours</div>
</div>

<div class="timer-wrap">
  <div class="timer-display" id="timerDisplay">00:00</div>
  <div class="timer-btns">
    <button class="timer-btn start" id="timerStartBtn" onclick="timerToggle()">▶ Start</button>
  </div>
</div>

<div class="scoreboard">
  <div class="score-header" id="scoreHeader">
    <span>Équipe</span>
    <span>S1</span>
    <span>S2</span>
    <span>S3</span>
    <span>Points</span>
  </div>
  <div class="team-row team-a" id="rowA">
    <div class="team-info">
      <div class="team-name" id="nameA">Équipe A</div>
      <div class="team-players" id="playersA">—</div>
    </div>
    <div class="cell set-score" id="setA1">—</div>
    <div class="cell set-score" id="setA2">—</div>
    <div class="cell set-score" id="setA3">—</div>
    <div class="cell point-cell" id="ptA">0</div>
  </div>
  <div class="team-row team-b" id="rowB">
    <div class="team-info">
      <div class="team-name" id="nameB">Équipe B</div>
      <div class="team-players" id="playersB">—</div>
    </div>
    <div class="cell set-score" id="setB1">—</div>
    <div class="cell set-score" id="setB2">—</div>
    <div class="cell set-score" id="setB3">—</div>
    <div class="cell point-cell" id="ptB">0</div>
  </div>
</div>

<div id="dynamicControls"></div>

<div class="actions" style="margin-top:1rem">
  <button class="btn-action undo" onclick="undo()">↩ Annuler</button>
  <button class="btn-action pdf" onclick="exportPDF()">⬇ PDF</button>
  <button class="btn-action reset" onclick="resetMatch()">⟳ Reset</button>
</div>

<div class="stats-card" id="statsCard">
  <div class="stats-title">Stats en direct</div>

  <div id="statsContent">
    <div class="stat-row">
      <div class="stat-val a" id="st-wA">0</div>
      <div class="stat-name">Coups gagnants</div>
      <div class="stat-val b" id="st-wB">0</div>
    </div>
    <div class="stat-row">
      <div class="stat-bar-wrap"><div class="stat-bar-a" id="bar-wA" style="width:50%"></div><div class="stat-bar-b" id="bar-wB" style="width:50%"></div></div>
    </div>

    <div class="stat-row" style="margin-top:.6rem">
      <div class="stat-val a" id="st-fA">0</div>
      <div class="stat-name">Fautes directes</div>
      <div class="stat-val b" id="st-fB">0</div>
    </div>
    <div class="stat-row">
      <div class="stat-bar-wrap"><div class="stat-bar-a" id="bar-fA" style="width:50%"></div><div class="stat-bar-b" id="bar-fB" style="width:50%"></div></div>
    </div>

    <div class="stat-row" style="margin-top:.6rem">
      <div class="stat-val a" id="st-pA">0</div>
      <div class="stat-name">Points gagnés</div>
      <div class="stat-val b" id="st-pB">0</div>
    </div>
    <div class="stat-row">
      <div class="stat-bar-wrap"><div class="stat-bar-a" id="bar-pA" style="width:50%"></div><div class="stat-bar-b" id="bar-pB" style="width:50%"></div></div>
    </div>
  </div>
</div>

<div class="log-wrap">
  <div class="log-title">Journal du match</div>
  <div class="log-list" id="logList"></div>
</div>

<div class="winner-overlay" id="winnerOverlay">
  <div class="winner-box">
    <div class="winner-trophy">🏆</div>
    <div class="winner-label">Vainqueur du match</div>
    <div class="winner-name" id="winnerName">—</div>
    <div class="winner-score" id="winnerScore">—</div>
    <div class="winner-stats">
      <div class="ws-box">
        <div class="ws-val a" id="ws-wA">0</div><div class="ws-lbl">Winners A</div>
        <div class="ws-val b" id="ws-wB" style="margin-top:6px">0</div><div class="ws-lbl">Winners B</div>
      </div>
      <div class="ws-box">
        <div class="ws-val a" id="ws-fA">0</div><div class="ws-lbl">Fautes A</div>
        <div class="ws-val b" id="ws-fB" style="margin-top:6px">0</div><div class="ws-lbl">Fautes B</div>
      </div>
    </div>
    <div class="winner-actions">
      <button class="winner-btn primary" onclick="exportPDF()">⬇ Télécharger PDF</button>
      <button class="winner-btn secondary" onclick="resetMatch()">Nouveau match</button>
    </div>
  </div>
</div>

<script>
// ── PLAYER NAMES & MODE ──────────────────────────────────────────────────────
const _p = new URLSearchParams(window.location.search);
const players = {
  j1: _p.get('j1') || 'Joueur 1',
  j2: _p.get('j2') || 'Joueur 2',
  j3: _p.get('j3') || 'Joueur 3',
  j4: _p.get('j4') || 'Joueur 4'
};
const mode = _p.get('mode') || 'equipe'; // 'joueur' ou 'equipe'
const nameA = players.j1 + ' / ' + players.j2;
const nameB = players.j3 + ' / ' + players.j4;

// Les noms viennent de l'URL (?j1=...) : on les échappe avant toute insertion
// via innerHTML. Attention : un simple échappement HTML ne suffit PAS à
// protéger un nom inséré à l'intérieur d'un attribut onclick="...'...'"
// (le navigateur décode les entités HTML avant d'exécuter le JS de
// l'attribut, donc un caractère ' ou ) pourrait quand même casser hors de
// la chaîne JS). C'est pourquoi createControlBlock() ci-dessous n'insère
// jamais le nom lui-même dans le onclick : seul un identifiant fixe et sûr
// ('j1'..'j4' ou null), choisi par le code et jamais par l'utilisateur, y
// est placé. Le vrai nom n'est utilisé que comme texte (via escapeHtml) ou
// comme valeur JS normale (jamais recomposé en code).
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function initNames() {
  document.getElementById('playersA').textContent = nameA;
  document.getElementById('playersB').textContent = nameB;
  
  const container = document.getElementById('dynamicControls');
  container.innerHTML = '';

  if (mode === 'joueur') {
    container.innerHTML += createControlBlock('a', players.j1, 1, 'j1');
    container.innerHTML += createControlBlock('a', players.j2, 1, 'j2');
    container.innerHTML += createControlBlock('b', players.j3, 2, 'j3');
    container.innerHTML += createControlBlock('b', players.j4, 2, 'j4');

    // Modifier l'affichage des stats en direct pour le mode individuel
    let statsHTML = `<div class="stat-row" style="grid-template-columns: 1fr 60px 60px; margin-bottom:8px; border-bottom: 1px solid var(--border); padding-bottom: 5px;">
      <div class="stat-name" style="text-align:left">Joueur</div>
      <div class="stat-name">W</div>
      <div class="stat-name">F</div>
    </div>`;
    ['j1', 'j2', 'j3', 'j4'].forEach((key, index) => {
      const colorClass = index < 2 ? 'var(--blue)' : 'var(--orange)';
      statsHTML += `
        <div class="stat-row" style="grid-template-columns: 1fr 60px 60px; align-items:center">
          <div class="stat-name" style="text-align:left; color:var(--text); font-size:13px">${escapeHtml(players[key])}</div>
          <div class="stat-val" id="st-w-${key}" style="text-align:center; color:var(--green); font-size:20px">0</div>
          <div class="stat-val" id="st-f-${key}" style="text-align:center; color:var(--red); font-size:20px">0</div>
        </div>`;
    });
    document.getElementById('statsContent').innerHTML = statsHTML;
  } else {
    const shortA = players.j1.split(' ')[0] + ' & ' + players.j2.split(' ')[0];
    const shortB = players.j3.split(' ')[0] + ' & ' + players.j4.split(' ')[0];
    container.innerHTML += createControlBlock('a', 'Équipe A — ' + shortA, 1, null);
    container.innerHTML += createControlBlock('b', 'Équipe B — ' + shortB, 2, null);
  }
}

function createControlBlock(teamClass, label, teamId, entityKey) {
  const opponentId = teamId === 1 ? 2 : 1;
  const subLabel = teamId === 1 ? 'Point à A' : 'Point à B';
  // entityKey vaut toujours 'j1'..'j4' ou null : jamais une valeur saisie
  // par l'utilisateur, donc sûr à insérer tel quel dans le onclick.
  const entityArg = entityKey ? `'${entityKey}'` : 'null';
  return `
    <div class="team-controls">
      <div class="team-ctrl-label ${teamClass}">${escapeHtml(label)}</div>
      <div class="ctrl-row">
        <button class="btn-winner ${teamClass}" onclick="scorePoint(${teamId},'winner', ${entityArg})">
          <span class="btn-icon">🎯</span>
          <span class="btn-main">Point gagnant</span>
          <span class="btn-sub">Coup gagnant</span>
        </button>
        <button class="btn-faute ${teamClass}" onclick="scorePoint(${opponentId},'faute', ${entityArg})">
          <span class="btn-icon">💥</span>
          <span class="btn-main">Faute directe</span>
          <span class="btn-sub">${subLabel}</span>
        </button>
      </div>
    </div>
  `;
}

// ── STATE ─────────────────────────────────────────────────────────────────────
let p1=0, p2=0, g1=0, g2=0, s1=0, s2=0;
let setHistory=[]; 
let inTiebreak=false, inSuperTiebreak=false, matchOver=false;
let stats = { wA:0, wB:0, fA:0, fB:0, pA:0, pB:0, ind: {} };
let history = [];
let matchLog = [];
const TP = ['0','15','30','40'];

// ── SAVE STATE ────────────────────────────────────────────────────────────────
function saveState() {
  history.push({
    p1,p2,g1,g2,s1,s2,inTiebreak,inSuperTiebreak,
    stats: JSON.parse(JSON.stringify(stats)),
    pill: document.getElementById('setPill').innerText,
    status: document.getElementById('statusLabel').innerText
  });
}

// ── SCORE LOGIC ───────────────────────────────────────────────────────────────
function scoreSnapshot(player) {
  let pp1=p1, pp2=p2;
  if (player === 1) pp1++; else pp2++;
  let ptStr;
  if (inSuperTiebreak || inTiebreak) {
    ptStr = pp1 + '-' + pp2;
  } else {
    let a = TP[Math.min(pp1,3)] || '0';
    let b = TP[Math.min(pp2,3)] || '0';
    if (pp1>=3 && pp2>=3) { a='40'; b='40'; }
    ptStr = a + '-' + b;
  }
  return ptStr + ' · Jeu ' + g1 + '-' + g2 + ' · Set ' + s1 + '-' + s2;
}

function scorePoint(player, type, entityKey) {
  if (matchOver) return;
  ensureTimerRunning();
  saveState();

  // Le nom réel n'est résolu qu'ici, à partir d'un identifiant sûr ('j1'..'j4') —
  // jamais reconstruit à partir d'une chaîne injectée dans le onclick.
  const entityName = entityKey ? players[entityKey] : null;

  // Stats Équipe
  if (player === 1) {
    stats.pA++;
    if (type === 'winner') stats.wA++; else stats.fB++; 
  } else {
    stats.pB++;
    if (type === 'winner') stats.wB++; else stats.fA++; 
  }

  // Stats Individuelles (indexées par la clé sûre 'j1'..'j4', pas par le nom)
  if (mode === 'joueur' && entityKey) {
    if (!stats.ind[entityKey]) stats.ind[entityKey] = { w:0, f:0 };
    if (type === 'winner') {
      stats.ind[entityKey].w++;
    } else {
      stats.ind[entityKey].f++;
    }
  }

  const scoreLabel = scoreSnapshot(player);
  logPoint(entityName || (player === 1 ? nameA : nameB), type, scoreLabel);

  if (inSuperTiebreak) {
    if (player === 1) p1++; else p2++;
    if ((p1 >= 10 || p2 >= 10) && Math.abs(p1 - p2) >= 2) {
      winMatch(player); return;
    }
    updateDisplay(); return;
  }

  if (inTiebreak) {
    if (player === 1) p1++; else p2++;
    if ((p1 >= 7 || p2 >= 7) && Math.abs(p1 - p2) >= 2) {
      winGame(player);
    }
    updateDisplay(); return;
  }

  if (player === 1) p1++; else p2++;
  if (p1 > 3 || p2 > 3) {
    if (p1 > p2) winGame(1); else winGame(2);
    return;
  }
  updateDisplay();
}

function winGame(player) {
  const wasTiebreak = inTiebreak;
  p1=0; p2=0; inTiebreak=false;
  if (player === 1) g1++; else g2++;
  logEvent(player===1 ? nameA : nameB, 'remporte le jeu → ' + g1 + '-' + g2);

  if (wasTiebreak) { winSet(player); return; }

  const maxG = Math.max(g1,g2), minG = Math.min(g1,g2);
  if (maxG >= 6 && maxG - minG >= 2) { winSet(player); return; }

  if (g1 === 6 && g2 === 6) {
    if (s1 === 1 && s2 === 1) {
      inSuperTiebreak=true; p1=0; p2=0;
      document.getElementById('setPill').textContent = 'Super Tie-Break';
      document.getElementById('statusLabel').textContent = "10 points, 2 d'écart";
      logEvent('', '⚡ Super Tie-Break (3e set) !');
    } else {
      inTiebreak=true; p1=0; p2=0;
      document.getElementById('setPill').textContent = 'Tie-Break';
      document.getElementById('statusLabel').textContent = "7 points, 2 d'écart";
      logEvent('', '🔀 Tie-Break !');
    }
  }
  updateDisplay();
}

function winSet(player){
  setHistory.push({a:g1,b:g2});
  p1=0; p2=0; g1=0; g2=0; 
  inTiebreak=false; inSuperTiebreak=false;
  if(player===1) s1++; else s2++;
  logEvent(player===1?nameA:nameB,"remporte le set ("+s1+"-"+s2+")");

  if(s1===2 || s2===2){
    winMatch(player); 
    return;
  }

  if(s1===1 && s2===1){
    inSuperTiebreak = true;
    document.getElementById('setPill').textContent = "Super Tie-Break";
    document.getElementById('statusLabel').textContent = "10 points, 2 d'écart";
  } else {
    document.getElementById('setPill').textContent = "Set "+(s1+s2+1);
    document.getElementById('statusLabel').textContent = "En cours";
  }
  updateDisplay();
}

function winMatch(player) {
  matchOver = true;
  if(timerRunning) timerToggle();
  const winner = player === 1 ? nameA : nameB;
  document.getElementById('winnerName').textContent = winner;
  document.getElementById('winnerScore').textContent = 'Sets ' + s1 + '-' + s2 + ' — ' + formatDuration(timerSeconds);
  document.getElementById('ws-wA').textContent = stats.wA;
  document.getElementById('ws-wB').textContent = stats.wB;
  document.getElementById('ws-fA').textContent = stats.fA;
  document.getElementById('ws-fB').textContent = stats.fB;
  document.getElementById('winnerOverlay').classList.add('show');
  logEvent(winner, '🏆 VAINQUEUR DU MATCH !');
  saveMatchToHistory(winner);
  updateDisplay();
}

// ── SAUVEGARDE DE L'HISTORIQUE (localStorage) ────────────────────────────────
// Chaque match terminé est ajouté à un tableau stocké dans le navigateur,
// sous la clé 'beachstats_history'. Il reste disponible tant que
// l'utilisateur ne vide pas son cache / n'utilise pas un autre appareil.
function saveMatchToHistory(winner) {
  const record = {
    id: Date.now(),
    date: new Date().toISOString(),
    page: 'Sbase',
    nameA, nameB,
    winner,
    sets: s1 + '-' + s2,
    setDetail: setHistory.map(sh => sh.a + '/' + sh.b).join('  '),
    setHistory: JSON.parse(JSON.stringify(setHistory)),
    matchLog: JSON.parse(JSON.stringify(matchLog)),
    players: JSON.parse(JSON.stringify(players)),
    mode,
    duration: formatDuration(timerSeconds),
    stats: { wA: stats.wA, wB: stats.wB, fA: stats.fA, fB: stats.fB, pA: stats.pA, pB: stats.pB }
  };
  let hist = [];
  try { hist = JSON.parse(localStorage.getItem('beachstats_history')) || []; } catch(e) { hist = []; }
  hist.push(record);
  try { localStorage.setItem('beachstats_history', JSON.stringify(hist)); }
  catch(e) { console.error('Sauvegarde impossible', e); }
}

// ── UNDO ──────────────────────────────────────────────────────────────────────
function undo() {
  if (matchOver) { matchOver=false; document.getElementById('winnerOverlay').classList.remove('show'); }
  if (history.length === 0) return;
  const last = history.pop();
  p1=last.p1; p2=last.p2; g1=last.g1; g2=last.g2; s1=last.s1; s2=last.s2;
  inTiebreak=last.inTiebreak; inSuperTiebreak=last.inSuperTiebreak;
  setHistory=last.setHistory||[];
  stats = JSON.parse(JSON.stringify(last.stats));
  document.getElementById('setPill').innerText = last.pill;
  document.getElementById('statusLabel').innerText = last.status;
  const list = document.getElementById('logList');
  if (list.firstChild) list.removeChild(list.firstChild);
  matchLog.shift();
  updateDisplay();
}

// ── DISPLAY ───────────────────────────────────────────────────────────────────
function updateDisplay() {
  let ptA, ptB;
  if (inSuperTiebreak || inTiebreak) {
    ptA=p1; ptB=p2;
  } else {
    ptA=TP[p1]||'0'; ptB=TP[p2]||'0';
    if (p1===3 && p2===3) { ptA='AD'; ptB='AD'; }
  }
  document.getElementById('ptA').textContent = ptA;
  document.getElementById('ptB').textContent = ptB;
  for(let i=1;i<=3;i++){
    const cellA=document.getElementById('setA'+i);
    const cellB=document.getElementById('setB'+i);
    if(i-1 < setHistory.length){
      const sh=setHistory[i-1];
      cellA.textContent=sh.a; cellB.textContent=sh.b;
      cellA.className='cell set-score '+(sh.a>sh.b?'won':'');
      cellB.className='cell set-score '+(sh.b>sh.a?'won':'');
    } else if(i-1 === setHistory.length){
      cellA.textContent=g1; cellB.textContent=g2;
      cellA.className='cell set-score active';
      cellB.className='cell set-score active';
    } else {
      cellA.textContent='—'; cellB.textContent='—';
      cellA.className='cell set-score'; cellB.className='cell set-score';
    }
  }

  if (mode === 'joueur') {
    ['j1', 'j2', 'j3', 'j4'].forEach(key => {
      document.getElementById(`st-w-${key}`).textContent = stats.ind[key]?.w || 0;
      document.getElementById(`st-f-${key}`).textContent = stats.ind[key]?.f || 0;
    });
  } else {
    document.getElementById('st-wA').textContent = stats.wA;
    document.getElementById('st-wB').textContent = stats.wB;
    document.getElementById('st-fA').textContent = stats.fA;
    document.getElementById('st-fB').textContent = stats.fB;
    document.getElementById('st-pA').textContent = stats.pA;
    document.getElementById('st-pB').textContent = stats.pB;
    updateBar('bar-wA','bar-wB', stats.wA, stats.wB);
    updateBar('bar-fA','bar-fB', stats.fA, stats.fB);
    updateBar('bar-pA','bar-pB', stats.pA, stats.pB);
  }
}

function updateBar(idA, idB, vA, vB) {
  const total = vA + vB;
  const pct = total === 0 ? 50 : Math.round((vA/total)*100);
  document.getElementById(idA).style.width = pct + '%';
  document.getElementById(idB).style.width = (100-pct) + '%';
}

// ── LOG ───────────────────────────────────────────────────────────────────────
function logPoint(entity, type, scoreLabel) {
  const isA = (entity === players.j1 || entity === players.j2 || entity.includes('Équipe A'));
  const time = new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  let label, dotClass;
  if (type === 'winner') {
    label = '🎯 Point gagnant'; dotClass = isA ? 'dot-a' : 'dot-b';
  } else {
    label = '💥 Faute directe'; dotClass = isA ? 'dot-a' : 'dot-b';
  }
  const entry = {team: entity, type, time, msg: label, score: scoreLabel};
  matchLog.unshift(entry);
  const list = document.getElementById('logList');
  const div = document.createElement('div');
  div.className = 'log-entry ' + dotClass;
  div.innerHTML = `<span class="dot"></span><span>${time} — <strong>${escapeHtml(entity)}</strong> <span style="color:var(--gold);font-family:Barlow Condensed,sans-serif;font-weight:700">${scoreLabel}</span></span><span class="log-tag ${type}">${label}</span>`;
  list.prepend(div);
}

function logEvent(team, msg) {
  const time = new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  const entry = {team, msg, time};
  matchLog.unshift(entry);
  const list = document.getElementById('logList');
  const div = document.createElement('div');
  div.className = 'log-entry event';
  div.innerHTML = `<span class="dot"></span><span>${time}${team?' — <strong>'+escapeHtml(team)+'</strong>':''} ${msg}</span>`;
  list.prepend(div);
}

// ── RESET ─────────────────────────────────────────────────────────────────────
function resetMatch() {
  if (!confirm('Remettre le match à zéro ?')) return;
  p1=0;p2=0;g1=0;g2=0;s1=0;s2=0;
  inTiebreak=false;inSuperTiebreak=false;matchOver=false;
  setHistory=[];
  timerReset();
  stats={wA:0,wB:0,fA:0,fB:0,pA:0,pB:0, ind: {}};
  history=[];matchLog=[];
  document.getElementById('setPill').textContent='Set 1';
  document.getElementById('statusLabel').textContent='En cours';
  document.getElementById('logList').innerHTML='';
  document.getElementById('winnerOverlay').classList.remove('show');
  updateDisplay();
  logEvent('','🎾 Match démarré — '+escapeHtml(nameA)+' vs '+escapeHtml(nameB));
}

// ── PDF EXPORT ────────────────────────────────────────────────────────────────
function formatDuration(secs){
  const h=Math.floor(secs/3600);
  const m=Math.floor((secs%3600)/60);
  const s=secs%60;
  if(h>0) return h+'h '+String(m).padStart(2,'0')+'min '+String(s).padStart(2,'0')+'s';
  return String(m).padStart(2,'0')+'min '+String(s).padStart(2,'0')+'s';
}

function exportPDF() {
  const {jsPDF} = window.jspdf;
  const doc = new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  const W=210, M=20;
  let y=M;

  const newPage = () => {
    doc.addPage();
    doc.setFillColor(8,15,30);
    doc.rect(0,0,W,297,'F');
    y = M;
  };

  const ensureSpace = (needed) => { if (y + needed > 282) newPage(); };

  // Les polices standards de jsPDF (Helvetica) ne supportent pas les emojis :
  // on les retire avant toute écriture dans le PDF pour éviter les caractères
  // corrompus (les emojis restent affichés normalement dans l'application).
  const stripEmoji = (str) => String(str)
    .replace(/[\u{1F1E6}-\u{1FFFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{2190}-\u{21FF}\uFE0F\u200D]/gu, '')
    .replace(/\s+/g, ' ')
    .trim();

  const sectionTitle = (title, color) => {
    ensureSpace(16);
    doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(...color);
    doc.text(title, M, y); y+=7;
    doc.setDrawColor(30,53,96); doc.line(M,y,W-M,y); y+=8;
  };

  // ── Fond sombre ──
  doc.setFillColor(8,15,30);
  doc.rect(0,0,W,297,'F');

  // ── Titre ──
  doc.setFont('helvetica','bold');
  doc.setFontSize(26); doc.setTextColor(245,197,24);
  doc.text('BEACH TENNIS — STATS DE BASE', W/2, y+8, {align:'center'});
  y+=18;

  // ── Date ──
  doc.setFontSize(10); doc.setTextColor(74,100,148);
  doc.text(new Date().toLocaleDateString('fr-FR',{weekday:'long',year:'numeric',month:'long',day:'numeric'}), W/2, y, {align:'center'});
  y+=10;
  doc.setDrawColor(30,53,96); doc.line(M,y,W-M,y); y+=10;

  // ══ 1. VAINQUEUR ET SCORE (pas de titre, juste le nom et le score) ═════════
  ensureSpace(40);

  const winnerIsA = s1 > s2;
  const winnerName = winnerIsA ? nameA : nameB;
  const scoreStr = setHistory.map(sh => {
    const wG = winnerIsA ? sh.a : sh.b;
    const lG = winnerIsA ? sh.b : sh.a;
    return wG + '/' + lG;
  }).join('   -   ');

  doc.setFont('helvetica','bold'); doc.setFontSize(20); doc.setTextColor(245,197,24);
  doc.text(winnerName, W/2, y, {align:'center'}); y+=9;
  doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.setTextColor(226,234,248);
  doc.text(scoreStr || '—', W/2, y, {align:'center'}); y+=8;
  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(74,100,148);
  doc.text('Durée du match : '+formatDuration(timerSeconds), W/2, y, {align:'center'});
  y+=12;

  [{label:'ÉQUIPE A',color:[59,130,246],name:nameA,sets:s1,idx:0},
   {label:'ÉQUIPE B',color:[249,115,22],name:nameB,sets:s2,idx:1}].forEach(t => {
    doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(...t.color);
    doc.text(t.label, M, y);
    doc.setFont('helvetica','normal'); doc.setFontSize(13); doc.setTextColor(226,234,248);
    doc.text(t.name, M, y+7);
    let setStr = setHistory.map((sh,i) => {
      const sc  = t.idx===0 ? sh.a : sh.b;
      const opp = t.idx===0 ? sh.b : sh.a;
      return 'S'+(i+1)+': '+sc+(sc>opp?'*':'');
    }).join('  ');
    if (setStr) { doc.setFontSize(9); doc.setTextColor(74,100,148); doc.text(setStr, M, y+13); }
    doc.setFont('helvetica','bold'); doc.setFontSize(18); doc.setTextColor(245,197,24);
    doc.text('Sets : '+t.sets, W-M, y+6, {align:'right'});
    y += setStr ? 20 : 16;
    doc.setDrawColor(30,53,96); doc.line(M,y,W-M,y); y+=8;
  });
  y+=2;

  // ══ 2. STATS DE POINTS GAGNANTS & FAUTES DIRECTES PAR ÉQUIPE ═══════════════
  sectionTitle('POINTS GAGNANTS & FAUTES DIRECTES — PAR ÉQUIPE', [245,197,24]);

  const rows = [
    ['Points gagnants', stats.wA, stats.wB],
    ['Fautes directes', stats.fA, stats.fB],
    ['Points gagnés', stats.pA, stats.pB],
  ];

  doc.setFontSize(9); doc.setTextColor(74,100,148);
  doc.text('Statistique', M, y);
  doc.text('Éq.A', W/2, y, {align:'center'});
  doc.text('Éq.B', W-M, y, {align:'right'});
  y+=4; doc.setDrawColor(30,53,96); doc.line(M,y,W-M,y); y+=5;
  rows.forEach(r => {
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(226,234,248); doc.text(r[0], M, y);
    doc.setFont('helvetica','bold');
    doc.setTextColor(59,130,246);  doc.text(String(r[1]), W/2, y, {align:'center'});
    doc.setTextColor(249,115,22); doc.text(String(r[2]), W-M, y, {align:'right'});
    y+=7;
  });
  doc.setDrawColor(30,53,96); doc.line(M,y,W-M,y); y+=10;

  // ══ 3. DÉTAIL PAR JOUEUR (si le mode individuel est actif) ══════════════════
  if (mode === 'joueur') {
    sectionTitle('DÉTAIL PAR JOUEUR', [245,197,24]);
    const playerDefs = [
      {name:players.j1, key:'j1', color:[59,130,246]},
      {name:players.j2, key:'j2', color:[59,130,246]},
      {name:players.j3, key:'j3', color:[249,115,22]},
      {name:players.j4, key:'j4', color:[249,115,22]},
    ];
    doc.setFontSize(9); doc.setTextColor(74,100,148);
    doc.text('Joueur', M, y);
    doc.text('Winners', W/2, y, {align:'center'});
    doc.text('Fautes', W-M, y, {align:'right'});
    y+=4; doc.setDrawColor(30,53,96); doc.line(M,y,W-M,y); y+=6;
    playerDefs.forEach(pl => {
      const w = stats.ind[pl.key]?.w || 0;
      const f = stats.ind[pl.key]?.f || 0;
      ensureSpace(8);
      doc.setFont('helvetica','normal'); doc.setFontSize(11); doc.setTextColor(...pl.color);
      doc.text(pl.name, M, y);
      doc.setFont('helvetica','bold');
      doc.setTextColor(34,197,94);  doc.text(String(w), W/2, y, {align:'center'});
      doc.setTextColor(239,68,68); doc.text(String(f), W-M, y, {align:'right'});
      y+=8;
    });
    doc.setDrawColor(30,53,96); doc.line(M,y,W-M,y); y+=10;
  }

  // ══ 4. JOURNAL DU MATCH COMPLET ══════════════════════════════════════════
  sectionTitle('JOURNAL DU MATCH COMPLET', [245,197,24]);
  [...matchLog].reverse().forEach(entry => {
    ensureSpace(6);
    doc.setFont('helvetica','normal'); doc.setFontSize(9);
    doc.setTextColor(74,100,148); doc.text(entry.time, M, y);
    doc.setTextColor(180,200,230);
    const txt = (entry.team ? stripEmoji(entry.team)+' — ':'')+stripEmoji(entry.msg);
    doc.text(txt, M+16, y);
    y+=6;
  });

  doc.save('BeachStats_'+new Date().toISOString().slice(0,10)+'.pdf');
}


// ── TIMER ────────────────────────────────────────────────────────────────────
let timerSeconds = 0;
let timerInterval = null;
let timerRunning = false;

function ensureTimerRunning() {
  if (!timerRunning && !matchOver) timerToggle();
}

function timerToggle() {
  if (timerRunning) {
    clearInterval(timerInterval);
    timerRunning = false;
    document.getElementById('timerStartBtn').textContent = '▶ Start';
    document.getElementById('timerStartBtn').className = 'timer-btn start';
    document.getElementById('timerDisplay').classList.remove('running');
  } else {
    timerRunning = true;
    document.getElementById('timerStartBtn').textContent = '⏸ Pause';
    document.getElementById('timerStartBtn').className = 'timer-btn pause';
    document.getElementById('timerDisplay').classList.add('running');
    timerInterval = setInterval(() => {
      timerSeconds++;
      const m = String(Math.floor(timerSeconds / 60)).padStart(2,'0');
      const s = String(timerSeconds % 60).padStart(2,'0');
      document.getElementById('timerDisplay').textContent = m + ':' + s;
    }, 1000);
  }
}

function timerReset() {
  clearInterval(timerInterval);
  timerRunning = false;
  timerSeconds = 0;
  document.getElementById('timerDisplay').textContent = '00:00';
  document.getElementById('timerDisplay').classList.remove('running');
  document.getElementById('timerStartBtn').textContent = '▶ Start';
  document.getElementById('timerStartBtn').className = 'timer-btn start';
}

// ── INIT ──────────────────────────────────────────────────────────────────────
initNames();
updateDisplay();
logEvent('', '🎾 Match démarré — '+escapeHtml(nameA)+' vs '+escapeHtml(nameB));
// ── THÈMES ────────────────────────────────────────────────────────────────
const PRO_THEMES = ['neon', 'sunset'];
let userTier = null;

function applyTheme(theme) { document.documentElement.setAttribute('data-theme', theme); }

function setTheme(theme) {
  if (PRO_THEMES.includes(theme) && userTier !== 'pro') {
    window.open('https://beachstats.gumroad.com/l/jlcqx', '_blank');
    return;
  }
  localStorage.setItem('beachstats_theme', theme);
  applyTheme(theme);
  document.querySelectorAll('.theme-swatch').forEach(b => b.classList.toggle('active', b.dataset.themeChoice === theme));
  document.getElementById('themeMenu')?.classList.remove('open');
}

function toggleThemeMenu(e) {
  e.stopPropagation();
  document.getElementById('themeMenu')?.classList.toggle('open');
}

document.addEventListener('click', function(e) {
  if (!e.target.closest('.theme-switch-wrap')) document.getElementById('themeMenu')?.classList.remove('open');
});

function updateThemeLockUI() {
  document.querySelectorAll('.theme-swatch').forEach(b => {
    const isProTheme = PRO_THEMES.includes(b.dataset.themeChoice);
    b.classList.toggle('locked', isProTheme && userTier !== 'pro');
  });
}

async function checkTier() {
  try {
    const res = await fetch('/api/tier');
    const data = await res.json();
    userTier = data.tier;
  } catch (e) {
    userTier = null;
  }
  updateThemeLockUI();
}

document.addEventListener('DOMContentLoaded', function() {
  const current = localStorage.getItem('beachstats_theme') || 'dark';
  document.querySelectorAll('.theme-swatch').forEach(b => b.classList.toggle('active', b.dataset.themeChoice === current));
  checkTier();
});

</script>
