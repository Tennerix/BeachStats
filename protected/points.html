<!DOCTYPE html>
<html lang="fr">
<head>
<script>(function(){var t=localStorage.getItem('beachstats_theme')||'dark';document.documentElement.setAttribute('data-theme',t);})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#090f1a">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BeachStats">
<title>Beach Tennis – Scoreboard</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,900;1,700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#080f1e;
  --surface:#0d1829;
  --card:#111e35;
  --border:#1e3560;
  --hover:#162040;
  --gold:#f5c518;
  --blue:#3b82f6;
  --orange:#f97316;
  --green:#22c55e;
  --red:#ef4444;
  --text:#e2eaf8;
  --muted:#4a6494;
}
[data-theme="light"]{
  --bg:#eef1f6; --surface:#e7ecf3; --card:#f7f9fc; --hover:#dde4ee; --border:#aebad2;
  --gold:#b3860f; --blue:#3b66c4; --orange:#c9601e; --green:#1f8a4c; --purple:#7c4bc4;
  --red:#c23a3a; --text:#2c3646; --muted:#748094;
}
[data-theme="neon"]{
  --bg:#050214; --surface:#0d0620; --card:#140a2e; --hover:#1c0f3d; --border:#3d1a6b;
  --gold:#ffe600; --blue:#00e5ff; --orange:#ff2e97; --green:#39ff14; --purple:#c644ff;
  --red:#ff2e5f; --text:#f2ecff; --muted:#8c6bc9;
}
[data-theme="sunset"]{
  --bg:linear-gradient(180deg,#200a12 0%,#4a1f16 22%,#b8531f 48%,#f0c542 62%,#6b2a52 84%,#241130 100%);
  --surface:linear-gradient(135deg,#3c1a14 0%,#6b3420 100%);
  --card:linear-gradient(150deg,#481f18 0%,#7a3f22 100%);
  --hover:linear-gradient(135deg,#5c2a1c 0%,#8a4a26 100%);
  --border:#a35a35;
  --gold:#ffcb3d; --blue:#5ec8f5; --orange:#ff7f3f; --green:#3fd9ae; --purple:#e488a8;
  --red:#ef4a4a; --text:#fff8ec; --muted:#e0b89f;
}
[data-theme="lagoon"]{
  --bg:linear-gradient(180deg,#02141a 0%,#053b3f 22%,#0a6e6e 48%,#17d6d0 62%,#0a4a5c 84%,#02121e 100%);
  --surface:linear-gradient(135deg,#04262b 0%,#0a4a4a 100%);
  --card:linear-gradient(150deg,#063339 0%,#0d5555 100%);
  --hover:linear-gradient(135deg,#0a4045 0%,#116868 100%);
  --border:#1ec9c9;
  --gold:#ffd166; --blue:#22d3ee; --orange:#ff8c42; --green:#2dd4a7; --purple:#7c83fd;
  --red:#ff5c5c; --text:#e0fbfc; --muted:#5fa8ac;
}
[data-theme="magma"]{
  --bg:linear-gradient(180deg,#0a0302 0%,#380a04 22%,#8a1c04 48%,#ff5b0f 62%,#5c0f0f 84%,#120303 100%);
  --surface:linear-gradient(135deg,#2e0a06 0%,#66190a 100%);
  --card:linear-gradient(150deg,#3d0e08 0%,#7d2308 100%);
  --hover:linear-gradient(135deg,#4d140b 0%,#992e0e 100%);
  --border:#ff5c1a;
  --gold:#ffc300; --blue:#3fa9ff; --orange:#ff4b00; --green:#a4d84a; --purple:#ff2e88;
  --red:#ff2020; --text:#fff2e0; --muted:#d98a5c;
}
[data-theme="glacier"]{
  --bg:linear-gradient(180deg,#020a12 0%,#062038 22%,#0f3f5c 48%,#63d8ff 62%,#123048 84%,#02101c 100%);
  --surface:linear-gradient(135deg,#04182a 0%,#0a3550 100%);
  --card:linear-gradient(150deg,#082238 0%,#0e3d5c 100%);
  --hover:linear-gradient(135deg,#0c2d46 0%,#155070 100%);
  --border:#3fa0cf;
  --gold:#d6faff; --blue:#7fd8ff; --orange:#ffb4a8; --green:#9dfcd8; --purple:#b8c6ff;
  --red:#ff8fa3; --text:#eaf9ff; --muted:#6f93ab;
}
/* ── SÉLECTEUR DE THÈME ── */
body{transition:background-color .25s ease,color .25s ease}
.theme-switch-wrap{position:relative}
.theme-menu{position:absolute;top:calc(100% + 8px);left:0;background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:8px;display:none;flex-direction:column;gap:2px;z-index:30;min-width:170px;
  box-shadow:0 8px 24px rgba(0,0,0,.5)}
.theme-menu.open{display:flex}
.theme-swatch{display:flex;align-items:center;gap:8px;background:none;border:none;color:var(--text);
  font-family:Barlow,sans-serif;font-size:13px;padding:7px 8px;border-radius:6px;cursor:pointer;text-align:left;width:100%}
.theme-swatch:hover{background:var(--surface)}
.theme-swatch.active{outline:1px solid var(--gold)}
.theme-swatch.locked{opacity:.55}
.theme-swatch .lock-badge{margin-left:auto;font-size:9px;font-weight:900;letter-spacing:.5px;color:var(--gold);display:none;align-items:center;gap:2px;flex-shrink:0}
.theme-swatch.locked .lock-badge{display:flex}
.sw{width:14px;height:14px;border-radius:50%;flex-shrink:0;border:1px solid rgba(255,255,255,.25)}
.sw-dark{background:linear-gradient(135deg,#080f1e,#3b82f6)}
.sw-light{background:linear-gradient(135deg,#f7f9fc,#3b66c4)}
.sw-neon{background:linear-gradient(135deg,#050214,#ff2e97)}
.sw-sunset{background:linear-gradient(135deg,#2a130f,#ff6b1a)}
.sw-lagoon{background:linear-gradient(135deg,#02141a,#17d6d0)}
.sw-magma{background:linear-gradient(135deg,#0a0302,#ff5b0f)}
.sw-glacier{background:linear-gradient(135deg,#020a12,#63d8ff)}

body{
  font-family:Barlow,sans-serif;
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:0 1rem 4rem;
}

/* ── HEADER ── */
.header{
  width:100%;
  max-width:580px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:1.2rem 0 1rem;
  border-bottom:1px solid var(--border);
  margin-bottom:1.4rem;flex-wrap:wrap;row-gap:8px;}
.header-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
@media(max-width:480px){
  .header-logo{font-size:18px}
  .header-back{font-size:11px;padding:5px 9px}
}
.header-logo{
  font-family:Barlow Condensed,sans-serif;
  font-size:22px;
  font-weight:900;
  letter-spacing:3px;
  text-transform:uppercase;
  color:var(--gold);
}
.header-logo span{color:var(--text);opacity:.5}
.header-back{
  background:none;
  border:1px solid var(--border);
  color:var(--muted);
  font-family:Barlow Condensed,sans-serif;
  font-size:12px;
  font-weight:700;
  letter-spacing:1.5px;
  text-transform:uppercase;
  padding:6px 14px;
  border-radius:8px;
  cursor:pointer;
  transition:all .18s;
}
.header-back:hover{border-color:var(--gold);color:var(--gold)}

/* ── STATUS BAR ── */
.status-bar{
  width:100%;
  max-width:580px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:.85rem 1.4rem;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin-bottom:1.2rem;
}
.status-pill{
  font-family:Barlow Condensed,sans-serif;
  font-size:13px;
  font-weight:700;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--bg);
  background:var(--gold);
  padding:4px 14px;
  border-radius:20px;
}
[data-theme="glacier"] .status-pill{color:#0a2e52}
[data-theme="sunset"] .status-pill{color:#3a140a}
[data-theme="lagoon"] .status-pill{color:#04302c}
[data-theme="magma"] .status-pill{color:#3a0a02}
.status-label{
  font-family:Barlow Condensed,sans-serif;
  font-size:14px;
  font-weight:700;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--muted);
}

/* ── SCOREBOARD CARD ── */
.scoreboard{
  width:100%;
  max-width:580px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 8px 48px rgba(0,0,0,.5);
  margin-bottom:1.2rem;
}

/* column header */
.score-header{
  display:grid;
  grid-template-columns:1fr 44px 44px 44px 80px;
  gap:0;
  padding:.6rem 1.4rem;
  background:var(--surface);
  border-bottom:1px solid var(--border);
}
.score-header span{
  font-family:Barlow Condensed,sans-serif;
  font-size:11px;
  font-weight:700;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--muted);
  text-align:center;
}
.score-header span:first-child{text-align:left}

/* team rows */
.team-row{
  display:grid;
  grid-template-columns:1fr 44px 44px 44px 80px;
  align-items:center;
  padding:1.1rem 1.4rem;
  border-bottom:1px solid var(--border);
  transition:background .15s;
}
.team-row:last-child{border-bottom:none}
.team-row.serving .team-info::before{
  content:'●';
  color:var(--gold);
  margin-right:6px;
  font-size:8px;
  vertical-align:middle;
}

.team-info{
  display:flex;
  flex-direction:column;
  gap:3px;
}
.team-name{
  font-family:Barlow Condensed,sans-serif;
  font-size:16px;
  font-weight:900;
  letter-spacing:1px;
  text-transform:uppercase;
}
.team-players{
  font-size:11px;
  color:var(--muted);
  font-weight:500;
}

.cell{
  text-align:center;
  font-family:Barlow Condensed,sans-serif;
  font-size:20px;
  font-weight:900;
}
.cell.sets-cell span{
  display:inline-block;
  width:28px;
  height:28px;
  line-height:28px;
  border-radius:50%;
  font-size:14px;
  font-weight:900;
}
.cell.sets-cell span.won{
  background:var(--gold);
  color:var(--bg);
}
[data-theme="glacier"] .cell.sets-cell span.won{color:#0a2e52}
[data-theme="sunset"] .cell.sets-cell span.won{color:#3a140a}
[data-theme="lagoon"] .cell.sets-cell span.won{color:#04302c}
[data-theme="magma"] .cell.sets-cell span.won{color:#3a0a02}

.cell.point-cell{
  font-size:36px;
  color:var(--gold);
  font-style:italic;
}
.cell.set-score{
  font-family:Barlow Condensed,sans-serif;font-size:18px;font-weight:900;
  text-align:center;color:var(--muted);
}
.cell.set-score.active{color:var(--text)}
.cell.set-score.won{color:var(--gold)}
.cell.point-cell.inactive{
  color:var(--muted);
  font-size:28px;
}

/* ── TEAM COLOR ACCENTS ── */
.team-row.team-a .team-name{color:var(--blue)}
.team-row.team-b .team-name{color:var(--orange)}

/* ── CONTROLS ── */
.controls{
  width:100%;
  max-width:580px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:1.2rem;
}

.btn-point{
  padding:1.1rem;
  border-radius:14px;
  border:2px solid;
  font-family:Barlow Condensed,sans-serif;
  font-size:17px;
  font-weight:900;
  letter-spacing:1.5px;
  text-transform:uppercase;
  cursor:pointer;
  transition:all .15s;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  line-height:1;
}
.btn-point small{
  font-size:10px;
  font-weight:600;
  letter-spacing:2px;
  opacity:.7;
}
.btn-point.a{
  background:rgba(59,130,246,.12);
  border-color:var(--blue);
  color:var(--blue);
}
.btn-point.a:hover{background:rgba(59,130,246,.25);transform:scale(1.02)}
.btn-point.a:active{transform:scale(.97)}
.btn-point.b{
  background:rgba(249,115,22,.12);
  border-color:var(--orange);
  color:var(--orange);
}
.btn-point.b:hover{background:rgba(249,115,22,.25);transform:scale(1.02)}
.btn-point.b:active{transform:scale(.97)}

.actions{
  width:100%;
  max-width:580px;
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
  margin-bottom:1.2rem;
}
.btn-action{
  padding:.75rem;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  font-family:Barlow Condensed,sans-serif;
  font-size:13px;
  font-weight:700;
  letter-spacing:1.5px;
  text-transform:uppercase;
  cursor:pointer;
  transition:all .15s;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
}
.btn-action:hover{background:var(--hover);border-color:var(--muted)}
.btn-action.undo{border-color:#f59e0b;color:#f59e0b}
.btn-action.undo:hover{background:rgba(245,158,11,.12)}
.btn-action.reset{border-color:var(--red);color:var(--red)}
.btn-action.reset:hover{background:rgba(239,68,68,.12)}
.btn-action.pdf{border-color:var(--green);color:var(--green)}
.btn-action.pdf:hover{background:rgba(34,197,94,.12)}

/* ── HISTORY LOG ── */
.log-wrap{
  width:100%;
  max-width:580px;
}
.log-title{
  font-family:Barlow Condensed,sans-serif;
  font-size:12px;
  font-weight:700;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:.6rem;
  padding-left:4px;
}
.log-list{
  display:flex;
  flex-direction:column;
  gap:6px;
  max-height:180px;
  overflow-y:auto;
}
.log-entry{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:8px;
  padding:.5rem 1rem;
  font-size:12px;
  color:var(--muted);
  display:flex;
  align-items:center;
  gap:8px;
}
.log-entry .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.log-entry.dot-a .dot{background:var(--blue)}
.log-entry.dot-b .dot{background:var(--orange)}
.log-entry.event .dot{background:var(--gold)}

/* ── WINNER OVERLAY ── */
.winner-overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(8,15,30,.92);
  z-index:100;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:1.5rem;
  padding:2rem;
}
.winner-overlay.show{display:flex}
.winner-box{
  background:var(--card);
  border:2px solid var(--gold);
  border-radius:24px;
  padding:2.5rem 2rem;
  text-align:center;
  max-width:380px;
  width:100%;
  box-shadow:0 0 80px rgba(245,197,24,.2);
}
.winner-trophy{font-size:60px;margin-bottom:1rem}
.winner-label{
  font-family:Barlow Condensed,sans-serif;
  font-size:13px;
  font-weight:700;
  letter-spacing:3px;
  text-transform:uppercase;
  color:var(--gold);
  opacity:.7;
  margin-bottom:.5rem;
}
.winner-name{
  font-family:Barlow Condensed,sans-serif;
  font-size:36px;
  font-weight:900;
  letter-spacing:2px;
  text-transform:uppercase;
  color:#fff;
  margin-bottom:.4rem;
}
.winner-score{
  font-family:Barlow Condensed,sans-serif;
  font-size:18px;
  color:var(--muted);
  letter-spacing:1px;
  margin-bottom:1.5rem;
}
.winner-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.winner-btn{
  padding:.7rem 1.4rem;
  border-radius:10px;
  border:1.5px solid;
  font-family:Barlow Condensed,sans-serif;
  font-size:14px;
  font-weight:700;
  letter-spacing:1.5px;
  text-transform:uppercase;
  cursor:pointer;
  transition:all .15s;
}
.winner-btn.primary{border-color:var(--gold);color:var(--gold);background:rgba(245,197,24,.1)}
.winner-btn.primary:hover{background:rgba(245,197,24,.25)}
.winner-btn.secondary{border-color:var(--border);color:var(--muted);background:none}
.winner-btn.secondary:hover{border-color:var(--muted);color:var(--text)}

/* ── TIMER ── */
.timer-wrap{
  width:100%;max-width:580px;
  background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:.9rem 1.4rem;margin-bottom:1rem;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.timer-display{
  font-family:Barlow Condensed,sans-serif;font-size:38px;font-weight:900;
  letter-spacing:4px;color:var(--gold);font-variant-numeric:tabular-nums;
  min-width:110px;
}
.timer-display.running{color:#fff}
.timer-btns{display:flex;gap:8px}

.correction-toggle{
  width:100%;display:flex;align-items:center;justify-content:center;gap:8px;
  background:var(--surface);border:1px dashed var(--border);color:var(--muted);
  font-family:Barlow Condensed,sans-serif;font-size:12px;font-weight:700;letter-spacing:1.5px;
  text-transform:uppercase;padding:.6rem;border-radius:10px;cursor:pointer;margin-bottom:.8rem;
  transition:all .15s;
}
.correction-toggle:hover{color:var(--text);border-color:var(--muted)}
.correction-toggle-arrow{font-size:11px;transition:transform .2s}
.correction-toggle.open .correction-toggle-arrow{transform:rotate(180deg)}
.correction-panel{display:none;background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:1rem 1.1rem;margin-bottom:1rem}
.correction-panel.open{display:block}
.correction-hint{font-size:11.5px;color:var(--muted);line-height:1.5;margin-bottom:.9rem}
.correction-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.correction-col{display:flex;flex-direction:column;gap:6px}
.correction-col-label{font-family:Barlow Condensed,sans-serif;font-size:11px;font-weight:700;
  letter-spacing:1.5px;text-transform:uppercase;text-align:center;margin-bottom:2px}
.correction-col-label.a{color:var(--blue)}
.correction-col-label.b{color:var(--orange)}
.correction-btn-row{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.correction-btn{
  background:var(--surface);border:1px solid var(--border);color:var(--text);
  font-family:Barlow Condensed,sans-serif;font-size:12px;font-weight:700;letter-spacing:1px;
  text-transform:uppercase;padding:.55rem;border-radius:8px;cursor:pointer;transition:all .15s;
}
.correction-btn.a:hover{border-color:var(--blue);color:var(--blue)}
.correction-btn.b:hover{border-color:var(--orange);color:var(--orange)}
.correction-btn.minus{opacity:.72}
.correction-btn.minus:hover{opacity:1;border-color:var(--red);color:var(--red)}
.correction-super-btn{
  width:100%;margin-top:12px;background:var(--surface);border:1px dashed var(--gold);color:var(--gold);
  font-family:Barlow Condensed,sans-serif;font-size:11.5px;font-weight:700;letter-spacing:1px;
  text-transform:uppercase;padding:.65rem;border-radius:8px;cursor:pointer;transition:all .15s;
}
.correction-super-btn:hover{background:rgba(245,197,24,.12)}

.server-indicator{
  display:flex;align-items:center;gap:8px;width:100%;background:var(--card);
  border:1px solid var(--gold);border-radius:12px;padding:.6rem .9rem;margin-bottom:1rem;
}
.server-indicator.team-a{border-color:var(--blue)}
.server-indicator.team-b{border-color:var(--orange)}
.server-ball{font-size:16px;flex-shrink:0}
.server-indicator span{font-size:12.5px;color:var(--muted)}
.server-indicator .server-name{color:var(--text);font-family:Barlow Condensed,sans-serif;
  font-weight:900;letter-spacing:.5px}
.server-change-btn{
  margin-left:auto;flex-shrink:0;background:var(--surface);border:1px solid var(--border);
  color:var(--muted);font-family:Barlow Condensed,sans-serif;font-size:10.5px;font-weight:700;
  letter-spacing:1px;text-transform:uppercase;padding:.3rem .7rem;border-radius:14px;cursor:pointer;
}
.server-change-btn:hover{color:var(--text);border-color:var(--muted)}

.server-modal-backdrop{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:110;
  align-items:center;justify-content:center;padding:1rem;
}
.server-modal-backdrop.show{display:flex}
.server-modal-box{
  background:var(--card);border:1px solid var(--gold);border-radius:16px;
  padding:1.6rem 1.4rem;max-width:380px;width:100%;text-align:center;
}
.server-modal-title{
  font-family:Barlow Condensed,sans-serif;font-size:17px;font-weight:900;letter-spacing:.5px;
  color:var(--text);margin-bottom:.3rem;
}

<script>
// ── STATE ────────────────────────────────────────────────────────────────────
let p1=0, p2=0, g1=0, g2=0, s1=0, s2=0;
let setHistory=[]; // [{a:g1,b:g2}, ...]
let inTiebreak=false, inSuperTiebreak=false;
let history=[];
let matchLog=[];
let matchOver=false;
let stats={wA:0,wB:0,fA:0,fB:0,pA:0,pB:0};

// ── SERVICE (qui sert actuellement) ──────────────────────────────────────
let firstServingTeam = null;
let serverTeamAFirst = null;
let serverTeamBFirst = null;
let matchGameCount = 0;
let serverManualAdjustment = 0;

const TP=["0","15","30","40"];

// Player names from URL params (?j1=Alice&j2=Bob&j3=Charlie&j4=David)
const _p=new URLSearchParams(window.location.search);
let players={
  j1:_p.get('j1')||'Joueur 1',
  j2:_p.get('j2')||'Joueur 2',
  j3:_p.get('j3')||'Joueur 3',
  j4:_p.get('j4')||'Joueur 4'
};

const nameA = players.j1 + " / " + players.j2;
const nameB = players.j3 + " / " + players.j4;

// Les noms viennent de l'URL (?j1=...) : on les échappe avant toute
// insertion via innerHTML pour éviter qu'un lien piégé n'exécute du code.
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function initNames(){
  document.getElementById('nameA').textContent = "Équipe A";
  document.getElementById('playersA').textContent = nameA;
  document.getElementById('nameB').textContent = "Équipe B";
  document.getElementById('playersB').textContent = nameB;
  document.getElementById('btnA').textContent = players.j1.split(' ')[0] + " & " + players.j2.split(' ')[0];
  document.getElementById('btnB').textContent = players.j3.split(' ')[0] + " & " + players.j4.split(' ')[0];
}

// ── SAVE / RESTORE ───────────────────────────────────────────────────────────
function saveState(){
  history.push({p1,p2,g1,g2,s1,s2,inTiebreak,inSuperTiebreak,setHistory:JSON.parse(JSON.stringify(setHistory)),
    status:document.getElementById('statusLabel').innerText,
    pill:document.getElementById('setPill').innerText});
}

// ── SCORE LOGIC ──────────────────────────────────────────────────────────────
function scorePoint(player){
  if(matchOver) return;
  const pending = serverQuestionNeeded();
  if (pending === 'initial') { askInitialServer(); return; }
  if (pending === 'second') { askSecondTeamServer(); return; }
  saveState();
  advancePoint(player);
}

// Logique de progression du score (jeu / tie-break / super tie-break),
// commune à un point marqué normalement et à un point ajouté manuellement
// (bouton de rattrapage).
function advancePoint(player) {
  if(inSuperTiebreak){
    if(player===1) p1++; else p2++;
    if((p1>=10||p2>=10) && Math.abs(p1-p2)>=2){
      winSet(player, {a:p1, b:p2});
    } else {
      updateDisplay();
    }
    return;
  }

  if(inTiebreak){
    if(player===1) p1++; else p2++;
    if((p1>=7||p2>=7) && Math.abs(p1-p2)>=2){
      logEvent(player===1?nameA:nameB,"remporte le Tie-Break !");
      winGame(player);
    } else {
      updateDisplay();
    }
    return;
  }

  // Normal game — No-Ad rule
  if(player===1) p1++; else p2++;
  if(p1>3||p2>3){
    if(p1>p2) winGame(1); else winGame(2);
  } else {
    updateDisplay();
  }
}

// ── RATTRAPAGE DE SCORE (corrections manuelles) ──────────────────────────
// Pour reprendre un match déjà commencé, ou rattraper un point/jeu oublié.
function addManualPoint(player) {
  if (matchOver) return;
  const pending = serverQuestionNeeded();
  if (pending === 'initial') { askInitialServer(); return; }
  if (pending === 'second') { askSecondTeamServer(); return; }
  saveState();
  logEvent(player === 1 ? nameA : nameB, '➕ Point ajouté manuellement');
  advancePoint(player);
}

function addManualGame(player) {
  if (matchOver) return;
  const pending = serverQuestionNeeded();
  if (pending === 'initial') { askInitialServer(); return; }
  if (pending === 'second') { askSecondTeamServer(); return; }
  saveState();
  logEvent(player === 1 ? nameA : nameB, '➕ Jeu ajouté manuellement');
  winGame(player);
}

function removeManualPoint(player) {
  if (matchOver) return;
  saveState();
  if (player === 1) { if (p1 > 0) p1--; } else { if (p2 > 0) p2--; }
  logEvent(player === 1 ? nameA : nameB, '➖ Point retiré manuellement');
  updateDisplay();
}

function removeManualGame(player) {
  if (matchOver) return;
  saveState();
  if (player === 1) { if (g1 > 0) g1--; } else { if (g2 > 0) g2--; }
  if (matchGameCount > 0) matchGameCount--;
  logEvent(player === 1 ? nameA : nameB, '➖ Jeu retiré manuellement');
  updateDisplay();
}

// Raccourci pour rejoindre un match déjà à 1 set partout : place directement
// le score sur 1-1 et démarre le Super Tie-Break, sans avoir à rejouer les
// jeux/points des 2 sets précédents un par un.
function jumpToSuperTiebreak() {
  if (matchOver) return;
  if (!confirm("Passer directement à 1 set partout et démarrer le Super Tie-Break ?\n\nCette action remplace le score actuel des sets.")) return;
  saveState();
  s1 = 1; s2 = 1;
  g1 = 0; g2 = 0; p1 = 0; p2 = 0;
  inTiebreak = false; inSuperTiebreak = true;
  document.getElementById('setPill').textContent = 'Super Tie-Break';
  document.getElementById('statusLabel').textContent = "10 points, 2 d'écart";
  logEvent('', '⏩ Passage direct au Super Tie-Break (1 set partout)');
  updateDisplay();
}

function winGame(player){
  const wasTiebreak=inTiebreak;
  p1=0; p2=0; inTiebreak=false;
  if(player===1) g1++; else g2++;
  logEvent(player===1?nameA:nameB,"remporte le jeu → "+g1+"-"+g2);

  matchGameCount++;
  if (matchGameCount === 1 && firstServingTeam && !matchOver) {
    const otherKnown = firstServingTeam === 'A' ? serverTeamBFirst : serverTeamAFirst;
    if (!otherKnown) askSecondTeamServer();
  }

  // Si c'était un tie-break, le set est gagné 7/6
  if(wasTiebreak){
    winSet(player); return;
  }

  // Check set win
  const maxG=Math.max(g1,g2), minG=Math.min(g1,g2);
  if(maxG>=6 && maxG-minG>=2){
    winSet(player); return;
  }
  if(g1===6 && g2===6){
    if(s1===1 && s2===1){
      // 3rd set -> super tie-break
      inSuperTiebreak=true;
      p1=0; p2=0;
      document.getElementById('setPill').textContent="Super Tie-Break";
      document.getElementById('statusLabel').textContent="10 points, 2 d'écart";
      logEvent("","⚡ Super Tie-Break (3e set) !");
    } else {
      // Regular tie-break
      inTiebreak=true;
      p1=0; p2=0;
      document.getElementById('setPill').textContent="Tie-Break";
      document.getElementById('statusLabel').textContent="7 points, 2 d'écart";
      logEvent("","🔀 Tie-Break !");
    }
  }
  updateDisplay();
}

// ── SERVICE : calcul du serveur actuel ───────────────────────────────────
function computeCurrentServer() {
  if (!firstServingTeam) return null;

  let tiebreakOffset = 0;
  if (inTiebreak || inSuperTiebreak) {
    const played = p1 + p2;
    tiebreakOffset = played === 0 ? 0 : 1 + Math.floor((played - 1) / 2);
  }

  const turnIndex = matchGameCount + tiebreakOffset + serverManualAdjustment;
  const residue = ((turnIndex % 4) + 4) % 4;

  const secondTeam = firstServingTeam === 'A' ? 'B' : 'A';
  const team = (residue % 2 === 0) ? firstServingTeam : secondTeam;
  const withinTeamTurn = Math.floor(residue / 2) % 2;

  const secondA = serverTeamAFirst === 'j1' ? 'j2' : (serverTeamAFirst === 'j2' ? 'j1' : null);
  const secondB = serverTeamBFirst === 'j3' ? 'j4' : (serverTeamBFirst === 'j4' ? 'j3' : null);

  if (team === 'A') {
    if (!serverTeamAFirst) return { team: 'A', key: null };
    return { team: 'A', key: withinTeamTurn === 0 ? serverTeamAFirst : secondA };
  }
  if (!serverTeamBFirst) return { team: 'B', key: null };
  return { team: 'B', key: withinTeamTurn === 0 ? serverTeamBFirst : secondB };
}

function updateServerBadge() {
  const el = document.getElementById('serverIndicator');
  if (!el) return;
  const server = computeCurrentServer();
  if (!server || !server.key) { el.style.display = 'none'; return; }
  el.style.display = 'flex';
  el.querySelector('.server-name').textContent = players[server.key] || (server.team === 'A' ? nameA : nameB);
  el.className = 'server-indicator ' + (server.team === 'A' ? 'team-a' : 'team-b');
}

function serverQuestionNeeded() {
  if (!firstServingTeam) return 'initial';
  if (matchGameCount >= 1) {
    const otherKnown = firstServingTeam === 'A' ? serverTeamBFirst : serverTeamAFirst;
    if (!otherKnown) return 'second';
  }
  return null;
}

function askInitialServer() {
  const modal = document.getElementById('serverModal');
  const title = document.getElementById('serverModalTitle');
  const btnsWrap = document.getElementById('serverModalBtns');
  if (!modal) return;
  title.textContent = 'Qui sert en premier ?';
  btnsWrap.innerHTML = '';
  buildServerTeamGroup(btnsWrap, 'A', ['j1','j2'], (team, key) => {
    firstServingTeam = team; serverTeamAFirst = key;
    modal.classList.remove('show');
    updateServerBadge(); saveProgress();
  });
  buildServerTeamGroup(btnsWrap, 'B', ['j3','j4'], (team, key) => {
    firstServingTeam = team; serverTeamBFirst = key;
    modal.classList.remove('show');
    updateServerBadge(); saveProgress();
  });
  modal.classList.add('show');
}

function askSecondTeamServer() {
  const team = firstServingTeam === 'A' ? 'B' : 'A';
  const modal = document.getElementById('serverModal');
  const title = document.getElementById('serverModalTitle');
  const btnsWrap = document.getElementById('serverModalBtns');
  if (!modal) return;
  title.textContent = 'Et en face, qui sert en premier ?';
  btnsWrap.innerHTML = '';
  buildServerTeamGroup(btnsWrap, team, team === 'A' ? ['j1','j2'] : ['j3','j4'], (t, key) => {
    if (t === 'A') serverTeamAFirst = key; else serverTeamBFirst = key;
    modal.classList.remove('show');
    updateServerBadge(); saveProgress();
  });
  modal.classList.add('show');
}

function buildServerTeamGroup(container, team, keys, onPick) {
  const group = document.createElement('div');
  group.className = 'server-modal-group';
  const label = document.createElement('div');
  label.className = 'server-modal-group-label team-' + team.toLowerCase();
  label.textContent = 'Équipe ' + team;
  group.appendChild(label);
  const row = document.createElement('div');
  row.className = 'server-modal-group-row';
  keys.forEach(key => {
    const btn = document.createElement('button');
    btn.className = 'server-modal-btn team-' + team.toLowerCase();
    btn.textContent = players[key];
    btn.onclick = () => onPick(team, key);
    row.appendChild(btn);
  });
  group.appendChild(row);
  container.appendChild(group);
}

function cycleServerManually() {
  const pending = serverQuestionNeeded();
  if (pending === 'initial') { askInitialServer(); return; }
  if (pending === 'second') { askSecondTeamServer(); return; }
  serverManualAdjustment++;
  updateServerBadge();
  saveProgress();
}

function winSet(player, scoreOverride){
  const wasSuperTiebreak = inSuperTiebreak;
  setHistory.push(scoreOverride || {a:g1,b:g2});
  p1=0; p2=0; g1=0; g2=0; 
  inTiebreak=false; 
  inSuperTiebreak=false;

  if(player===1) s1++; else s2++;
  if (wasSuperTiebreak) {
    logEvent(player===1?nameA:nameB,"remporte le super tie-break ("+scoreOverride.a+"-"+scoreOverride.b+") et le match !");
  } else {
    logEvent(player===1?nameA:nameB,"remporte le set ("+s1+"-"+s2+")");
  }

  // Si une équipe a 2 sets, elle gagne le match
  if(s1===2 || s2===2){
    winMatch(player); 
    return;
  }

  // SI ON EST À 1-1 : On active immédiatement le Super Tie-Break pour le 3ème set
  if(s1===1 && s2===1){
    inSuperTiebreak = true;
    document.getElementById('setPill').textContent = "Super Tie-Break";
    document.getElementById('statusLabel').textContent = "10 points, 2 d'écart";
    logEvent("", "⚡ Début du Super Tie-Break (3e set) !");
  } else {
    // Passage au set 2 normal
    document.getElementById('setPill').textContent = "Set "+(s1+s2+1);
    document.getElementById('statusLabel').textContent = "En cours";
  }
  
  updateDisplay();
}

function winMatch(player){
  matchOver=true;
  // Stop timer when match ends
  if(timerRunning) timerToggle();
  const winner=player===1?nameA:nameB;
  const scoreStr=`Sets ${s1}-${s2}`;
  document.getElementById('winnerName').textContent=winner;
  document.getElementById('winnerScore').textContent=scoreStr+' — '+formatDuration(timerSeconds);
  document.getElementById('winnerOverlay').classList.add('show');
  logEvent(winner,"🏆 VAINQUEUR DU MATCH !");
  saveMatchToHistory(winner);
  clearProgress();
  updateDisplay();
}

// ── SAUVEGARDE DE L'HISTORIQUE (localStorage) ────────────────────────────────
function saveMatchToHistory(winner) {
  const record = {
    id: Date.now(),
    date: new Date().toISOString(),
    page: 'CDP',
    nameA, nameB,
    winner,
    sets: s1 + '-' + s2,
    setDetail: setHistory.map(sh => sh.a + '/' + sh.b).join('  '),
    setHistory: JSON.parse(JSON.stringify(setHistory)),
    matchLog: JSON.parse(JSON.stringify(matchLog)),
    players: JSON.parse(JSON.stringify(players)),
    mode: typeof mode !== 'undefined' ? mode : 'equipe',
    duration: formatDuration(timerSeconds),
    stats: { wA: stats.wA, wB: stats.wB, fA: stats.fA, fB: stats.fB, pA: stats.pA, pB: stats.pB }
  };
  let hist = [];
  try { hist = JSON.parse(localStorage.getItem('beachstats_history')) || []; } catch(e) { hist = []; }
  hist.push(record);
  try { localStorage.setItem('beachstats_history', JSON.stringify(hist)); }
  catch(e) { console.error('Sauvegarde impossible', e); }
}

// ── UNDO ─────────────────────────────────────────────────────────────────────
function undo(){
  if(matchOver){matchOver=false;document.getElementById('winnerOverlay').classList.remove('show');}
  if(history.length===0){alert("Rien à annuler !");return;}
  const last=history.pop();
  p1=last.p1; p2=last.p2; g1=last.g1; g2=last.g2; s1=last.s1; s2=last.s2;
  inTiebreak=last.inTiebreak; inSuperTiebreak=last.inSuperTiebreak;
  setHistory=last.setHistory||[];
  document.getElementById('statusLabel').innerText=last.status;
  document.getElementById('setPill').innerText=last.pill;
  updateDisplay();
}

// ── DISPLAY ──────────────────────────────────────────────────────────────────
function updateDisplay(){
  saveProgress();
  updateServerBadge();
  // Points display
  let ptA,ptB;
  if(inSuperTiebreak||inTiebreak){
    ptA=p1; ptB=p2;
  } else {
    ptA=TP[p1]||"0"; ptB=TP[p2]||"0";
    if(p1===3&&p2===3){ptA="AD"; ptB="AD";} // deuce display
  }
  document.getElementById('ptA').textContent=ptA;
  document.getElementById('ptB').textContent=ptB;

  // Per-set scores display
  for(let i=1;i<=3;i++){
    const cellA=document.getElementById('setA'+i);
    const cellB=document.getElementById('setB'+i);
    if(i-1 < setHistory.length){
      // completed set
      const sh=setHistory[i-1];
      cellA.textContent=sh.a;
      cellB.textContent=sh.b;
      cellA.className='cell set-score '+(sh.a>sh.b?'won':'');
      cellB.className='cell set-score '+(sh.b>sh.a?'won':'');
    } else if(i-1 === setHistory.length){
      // current set in progress
      cellA.textContent=g1;
      cellB.textContent=g2;
      cellA.className='cell set-score active';
      cellB.className='cell set-score active';
    } else {
      // future set
      cellA.textContent='—';
      cellB.textContent='—';
      cellA.className='cell set-score';
      cellB.className='cell set-score';
    }
  }
}

// ── LOG ──────────────────────────────────────────────────────────────────────
function logEvent(team,msg){
  const isA=(team===nameA);
  const isB=(team===nameB);
  const entry={team,msg,time:new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})};
  const className='log-entry '+(isA?'dot-a':isB?'dot-b':'event');
  const html=`<span class="dot"></span><span>${entry.time} — ${team?'<strong>'+escapeHtml(team)+'</strong> ':''} ${msg}</span>`;
  entry._dom={className,html};
  matchLog.unshift(entry);
  const list=document.getElementById('logList');
  const div=document.createElement('div');
  div.className=className;
  div.innerHTML=html;
  list.prepend(div);
}

// ── SAUVEGARDE DU MATCH EN COURS (protège d'un rafraîchissement accidentel) ──
const PROGRESS_KEY = 'beachstats_inprogress_points';

function saveProgress() {
  if (matchOver) { clearProgress(); return; }
  const snapshot = {
    p1, p2, g1, g2, s1, s2, setHistory, inTiebreak, inSuperTiebreak, matchOver,
    stats, history, matchLog, timerSeconds,
    firstServingTeam, serverTeamAFirst, serverTeamBFirst, matchGameCount, serverManualAdjustment,
    nameA, nameB, savedAt: Date.now(),
  };
  try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(snapshot)); } catch(e) {}
}

function clearProgress() {
  try { localStorage.removeItem(PROGRESS_KEY); } catch(e) {}
}

function loadProgress() {
  try {
    const raw = localStorage.getItem(PROGRESS_KEY);
    if (!raw) return null;
    const snap = JSON.parse(raw);
    // Un match sans le moindre point marqué n'a pas besoin d'être proposé en reprise
    if (snap.p1===0 && snap.p2===0 && snap.g1===0 && snap.g2===0 && snap.s1===0 && snap.s2===0) return null;
    return snap;
  } catch(e) { return null; }
}

function rebuildLog() {
  const list = document.getElementById('logList');
  list.innerHTML = '';
  matchLog.forEach(entry => {
    if (!entry._dom) return;
    const div = document.createElement('div');
    div.className = entry._dom.className;
    div.innerHTML = entry._dom.html;
    list.appendChild(div);
  });
}

function applyProgress(snap) {
  p1=snap.p1; p2=snap.p2; g1=snap.g1; g2=snap.g2; s1=snap.s1; s2=snap.s2;
  setHistory = snap.setHistory || [];
  inTiebreak = snap.inTiebreak; inSuperTiebreak = snap.inSuperTiebreak; matchOver = snap.matchOver;
  stats = snap.stats || stats;
  history = snap.history || [];
  matchLog = snap.matchLog || [];
  timerSeconds = snap.timerSeconds || 0;
  firstServingTeam = snap.firstServingTeam || null;
  serverTeamAFirst = snap.serverTeamAFirst || null;
  serverTeamBFirst = snap.serverTeamBFirst || null;
  matchGameCount = snap.matchGameCount || 0;
  serverManualAdjustment = snap.serverManualAdjustment || 0;
  document.getElementById('setPill').textContent = inSuperTiebreak ? 'Super Tie-Break' : 'Set '+(s1+s2+1);
  document.getElementById('statusLabel').textContent = matchOver ? 'Terminé' : 'En cours';
  rebuildLog();
  const m = String(Math.floor(timerSeconds / 60)).padStart(2,'0');
  const s = String(timerSeconds % 60).padStart(2,'0');
  document.getElementById('timerDisplay').textContent = m + ':' + s;
  updateDisplay();
}

function confirmResume() {
  const snap = loadProgress();
  document.getElementById('resumeOverlay').classList.remove('show');
  if (snap) applyProgress(snap);
}

function discardResume() {
  clearProgress();
  document.getElementById('resumeOverlay').classList.remove('show');
  updateDisplay();
  logEvent("","🎾 Match démarré — "+escapeHtml(nameA)+" vs "+escapeHtml(nameB));
}

function checkResumeOnLoad() {
  const snap = loadProgress();
  if (!snap) return;
  const matchup = (snap.nameA || nameA) + ' vs ' + (snap.nameB || nameB);
  document.getElementById('resumeMatchup').textContent = matchup;
  document.getElementById('resumeScoreInfo').textContent = `Sets ${snap.s1}-${snap.s2} · Jeux ${snap.g1}-${snap.g2}`;
  document.getElementById('resumeOverlay').classList.add('show');
}

// ── RESET ─────────────────────────────────────────────────────────────────────
function resetMatch() {
  if (!confirm('Remettre le match à zéro ?')) return;
  clearProgress();
  p1=0;p2=0;g1=0;g2=0;s1=0;s2=0;
  inTiebreak=false;inSuperTiebreak=false;matchOver=false;
  setHistory=[];
  timerReset();
  firstServingTeam=null; serverTeamAFirst=null; serverTeamBFirst=null; matchGameCount=0; serverManualAdjustment=0;
  stats={wA:0,wB:0,fA:0,fB:0,pA:0,pB:0};
  history=[];matchLog=[];
  document.getElementById('setPill').textContent='Set 1';
  document.getElementById('statusLabel').textContent='En cours';
  document.getElementById('logList').innerHTML='';
  document.getElementById('winnerOverlay').classList.remove('show');
  updateDisplay();
  logEvent('','🎾 Match démarré — '+escapeHtml(nameA)+' vs '+escapeHtml(nameB));
}

// ── PDF EXPORT ───────────────────────────────────────────────────────────────
function formatDuration(secs){
  const h=Math.floor(secs/3600);
  const m=Math.floor((secs%3600)/60);
  const s=secs%60;
  if(h>0) return h+'h '+String(m).padStart(2,'0')+'min '+String(s).padStart(2,'0')+'s';
  return String(m).padStart(2,'0')+'min '+String(s).padStart(2,'0')+'s';
}

function exportPDF(){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});

  const W=210, M=20;
  let y=M;

  // Title
  doc.setFillColor(8,15,30);
  doc.rect(0,0,W,297,'F');

  doc.setFont('helvetica','bold');
  doc.setFontSize(28);
  doc.setTextColor(245,197,24);
  doc.text("BEACH TENNIS",W/2,y+8,{align:'center'});
  doc.setFontSize(12);
  doc.setTextColor(74,100,148);
  doc.text("RÉSUMÉ DU MATCH",W/2,y+16,{align:'center'});
  y+=28;

  // Date
  doc.setFontSize(10);
  doc.setTextColor(74,100,148);
  doc.text(new Date().toLocaleDateString('fr-FR',{weekday:'long',year:'numeric',month:'long',day:'numeric'}),W/2,y,{align:'center'});
  y+=6;
  doc.setFontSize(10);
  doc.setTextColor(245,197,24);
  doc.text('Durée du match : '+formatDuration(timerSeconds),W/2,y+4,{align:'center'});
  y+=12;

  // Divider
  doc.setDrawColor(30,53,96);
  doc.line(M,y,W-M,y);
  y+=10;

  // Teams
  const teams=[
    {label:"ÉQUIPE A",color:[59,130,246],players:nameA,sets:s1,games:g1},
    {label:"ÉQUIPE B",color:[249,115,22],players:nameB,sets:s2,games:g2}
  ];
  teams.forEach(t=>{
    doc.setFont('helvetica','bold');
    doc.setFontSize(11);
    doc.setTextColor(...t.color);
    doc.text(t.label,M,y);
    doc.setFont('helvetica','normal');
    doc.setFontSize(13);
    doc.setTextColor(226,234,248);
    doc.text(t.players,M,y+7);
    doc.setFont('helvetica','bold');
    doc.setFontSize(20);
    doc.setTextColor(245,197,24);
    doc.text(`Sets : ${t.sets}`,W-M,y+4,{align:'right'});
    y+=18;
    doc.setDrawColor(30,53,96);
    doc.line(M,y,W-M,y);
    y+=8;
  });

  // Match log
  y+=4;
  doc.setFont('helvetica','bold');
  doc.setFontSize(11);
  doc.setTextColor(245,197,24);
  doc.text("JOURNAL DU MATCH",M,y);
  y+=8;

  const logsToShow=[...matchLog].reverse().slice(0,30);
  logsToShow.forEach(entry=>{
    if(y>270){doc.addPage();y=M;}
    doc.setFont('helvetica','normal');
    doc.setFontSize(9);
    doc.setTextColor(74,100,148);
    doc.text(`${entry.time}`,M,y);
    doc.setTextColor(180,200,230);
    doc.text(`${entry.team?entry.team+' — ':''}${entry.msg}`,M+18,y);
    y+=6;
  });

  doc.save(`BeachTennis_${new Date().toISOString().slice(0,10)}.pdf`);
}

// ── TIMER ────────────────────────────────────────────────────────────────────
let timerSeconds = 0;
let timerInterval = null;
let timerRunning = false;

function toggleCorrectionPanel() {
  document.getElementById('correctionPanel').classList.toggle('open');
  document.querySelector('.correction-toggle').classList.toggle('open');
}

function timerToggle() {
  if (timerRunning) {
    clearInterval(timerInterval);
    timerRunning = false;
    document.getElementById('timerStartBtn').textContent = '▶ Start';
    document.getElementById('timerStartBtn').className = 'timer-btn start';
    document.getElementById('timerDisplay').classList.remove('running');
  } else {
    timerRunning = true;
    document.getElementById('timerStartBtn').textContent = '⏸ Pause';
    document.getElementById('timerStartBtn').className = 'timer-btn pause';
    document.getElementById('timerDisplay').classList.add('running');
    if (!firstServingTeam) askInitialServer();
    timerInterval = setInterval(() => {
      timerSeconds++;
      const m = String(Math.floor(timerSeconds / 60)).padStart(2,'0');
      const s = String(timerSeconds % 60).padStart(2,'0');
      document.getElementById('timerDisplay').textContent = m + ':' + s;
    }, 1000);
  }
}

function timerReset() {
  clearInterval(timerInterval);
  timerRunning = false;
  timerSeconds = 0;
  document.getElementById('timerDisplay').textContent = '00:00';
  document.getElementById('timerDisplay').classList.remove('running');
  document.getElementById('timerStartBtn').textContent = '▶ Start';
  document.getElementById('timerStartBtn').className = 'timer-btn start';
}

// ── INIT ─────────────────────────────────────────────────────────────────────
initNames();
const _savedProgress = loadProgress();
if (_savedProgress) {
  checkResumeOnLoad();
} else {
  updateDisplay();
  logEvent("","🎾 Match démarré — "+escapeHtml(nameA)+" vs "+escapeHtml(nameB));
}
// ── THÈMES ────────────────────────────────────────────────────────────────
const PRO_THEMES = ['neon', 'sunset', 'lagoon', 'magma', 'glacier'];
let userTier = null;

function applyTheme(theme) { document.documentElement.setAttribute('data-theme', theme); }

function setTheme(theme) {
  if (PRO_THEMES.includes(theme) && userTier !== 'pro') {
    window.open('https://beachstats.gumroad.com/l/jlcqx', '_blank');
    return;
  }
  localStorage.setItem('beachstats_theme', theme);
  applyTheme(theme);
  document.querySelectorAll('.theme-swatch').forEach(b => b.classList.toggle('active', b.dataset.themeChoice === theme));
  document.getElementById('themeMenu')?.classList.remove('open');
}

function toggleThemeMenu(e) {
  e.stopPropagation();
  document.getElementById('themeMenu')?.classList.toggle('open');
}

document.addEventListener('click', function(e) {
  if (!e.target.closest('.theme-switch-wrap')) document.getElementById('themeMenu')?.classList.remove('open');
});

function updateThemeLockUI() {
  document.querySelectorAll('.theme-swatch').forEach(b => {
    const isProTheme = PRO_THEMES.includes(b.dataset.themeChoice);
    b.classList.toggle('locked', isProTheme && userTier !== 'pro');
  });
}

async function checkTier() {
  try {
    const res = await fetch('/api/tier');
    const data = await res.json();
    userTier = data.tier;
  } catch (e) {
    userTier = null;
  }
  updateThemeLockUI();
}

document.addEventListener('DOMContentLoaded', function() {
  const current = localStorage.getItem('beachstats_theme') || 'dark';
  document.querySelectorAll('.theme-swatch').forEach(b => b.classList.toggle('active', b.dataset.themeChoice === current));
  checkTier();
});
